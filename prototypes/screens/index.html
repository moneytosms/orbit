<!doctype html>
<!-- PROTOTYPE, throwaway (#26 Screen layouts and visual direction), round 3.
     Base: design A sidebar + design C widgets. Warm-Notion world. All state in memory; nothing persists.
     URL params for review: ?s=<screen>&id=<id>&device=desk|phone&theme=light|dark -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
 --bg:#fbfaf8;--side:#f5f3ef;--surface:#ffffff;--sunk:#f2efea;--hover:rgba(60,45,25,.055);--press:rgba(60,45,25,.09);
 --border:#ebe7e0;--border-strong:#dcd5ca;--text:#2a2723;--muted:#6b665e;--icon:#8a847a;
 --accent:#c2552f;--accent-ink:#fff;--accent-soft:#f8ebe4;--accent-line:#e9b9a5;--accent-text:#a3441f;
 --ok:#3d7a4d;--ok-soft:#e5f0e7;--ok-text:#2d6a3c;--warn:#9a5d08;--warn-soft:#f7ecd8;--warn-text:#8a5307;--danger:#bb3a2a;--danger-soft:#f9e6e2;--danger-text:#a8331f;
 --career:#b37419;--college:#3b6cb0;--learning:#468253;--home:#ad4f66;
 --sh1:0 1px 2px rgba(45,32,18,.06),0 1px 1px rgba(45,32,18,.03);
 --sh2:0 14px 36px rgba(45,32,18,.14),0 3px 8px rgba(45,32,18,.07);
 --focus:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
 color-scheme:light}
[data-theme=dark]{
 --bg:#1b1a18;--side:#211f1d;--surface:#252321;--sunk:#1e1d1b;--hover:rgba(255,240,220,.06);--press:rgba(255,240,220,.1);
 --border:#33302c;--border-strong:#45413b;--text:#ede8e0;--muted:#a8a197;--icon:#8f897f;
 --accent:#e2835e;--accent-ink:#1b1a18;--accent-soft:#3a281f;--accent-line:#7a4631;--accent-text:#e2835e;
 --ok:#7fc08c;--ok-soft:#1f2f23;--ok-text:#7fc08c;--warn:#e2ab5a;--warn-soft:#33291a;--warn-text:#e2ab5a;--danger:#ef8070;--danger-soft:#3a2320;--danger-text:#ef8070;
 --career:#dba24c;--college:#79a2e0;--learning:#82bb8d;--home:#dc8ba0;
 --sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 16px 40px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.lucide{width:16px;height:16px;stroke-width:1.8;flex:none}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;border:3px solid transparent;background-clip:padding-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stage{height:100vh;display:flex;align-items:center;justify-content:center}
.frame{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.phone .stage{background:#d9d4cb}[data-theme=dark] .phone .stage{background:#0d0c0b}
.phone .frame{width:390px;height:800px;border-radius:40px;border:10px solid #0d0c0b;box-shadow:0 30px 80px rgba(0,0,0,.35)}

/* shell */
.app{display:grid;grid-template-columns:256px 1fr;height:100%}
.app.noside{grid-template-columns:0 1fr}.app.noside .side{visibility:hidden}
.side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-scroll{overflow:auto;padding:4px 8px 12px;flex:1}
.brand{display:flex;align-items:center;gap:9px;padding:12px 10px 6px 14px;font-weight:600;font-size:15px}
.brand svg{width:22px;height:22px}.brand .ibtn{margin-left:auto}
.side-actions{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 8px 8px}
.sbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);box-shadow:var(--sh1)}
.sbtn:hover{border-color:var(--border-strong);color:var(--text)}
.kbd{display:inline-flex;align-items:center;font-size:11.5px;line-height:1;color:var(--muted);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:var(--surface);font-weight:500;font-family:inherit}
.sbtn .kbd{margin-left:auto}
.newbtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--sh1)}
.newbtn:hover{filter:brightness(1.06)}
.nv{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border-radius:7px;color:var(--text);position:relative}
.nv .lucide{color:var(--icon)}
.nv:hover{background:var(--hover)}.nv.on{background:var(--press);font-weight:600}.nv.on>.lucide{color:var(--accent)}
.nv .cnt{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:400}
.nv.sub{padding-left:38px;height:30px}
.arow{display:flex;align-items:center;border-radius:7px}.arow:hover{background:var(--hover)}.arow.on{background:var(--press)}.arow.on .nv{font-weight:600}
.arow .nv{flex:1;background:none;padding-left:4px}.arow .tw{width:24px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--icon);border-radius:6px;margin-left:2px;flex:none}
.arow .tw:hover{color:var(--text)}
.more{font-size:13px;color:var(--muted);padding:4px 10px 4px 38px;display:block;width:100%}.more:hover{color:var(--text)}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sec-h button{color:var(--icon);border-radius:5px;padding:2px;display:inline-flex}.sec-h button:hover{background:var(--hover);color:var(--text)}
.adot{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 15%,transparent);flex:none}
.adot .lucide{color:var(--c)!important;width:14px;height:14px}
.side-foot{border-top:1px solid var(--border);padding:8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.topbar{height:48px;display:flex;align-items:center;gap:6px;padding:0 16px 0 14px;flex:none}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;color:var(--muted)}
.crumbs button,.crumbs span{padding:3px 7px;border-radius:6px;white-space:nowrap}.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:500}.crumbs .lucide{width:14px;height:14px;color:var(--icon);padding:0}
.top-actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.view{flex:1;overflow:auto;min-height:0}
.wrap{max-width:1240px;margin:0 auto;padding:4px 32px 56px}
.wrap.narrow{max-width:880px}.wrap.full{max-width:none}
.ph{display:flex;align-items:center;gap:14px;margin:6px 0 16px;flex-wrap:wrap}
.ph h1{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:0;font-weight:700}
.ph .lead{color:var(--muted);margin-top:2px}
.ph>.grow{min-width:220px}
.title-ic{display:flex;align-items:center;gap:12px}
.title-ic .adot{width:38px;height:38px;border-radius:10px}.title-ic .adot .lucide{width:20px;height:20px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:500;box-shadow:var(--sh1);white-space:nowrap}
.btn:hover{border-color:var(--border-strong);background:color-mix(in srgb,var(--surface) 92%,var(--text))}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted)}.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled,.btn.primary:disabled{background:var(--sunk);border-color:var(--border);color:var(--muted);box-shadow:none;cursor:not-allowed;filter:none}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}.btn .kbd{margin-left:2px}
.btn.primary .kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.75}
.ibtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--icon);flex:none}
.ibtn:hover{background:var(--hover);color:var(--text)}.ibtn.sm{width:26px;height:26px}.ibtn.on{background:var(--accent-soft);color:var(--accent-text)}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--sunk);border:1px solid var(--border);gap:2px;flex-wrap:nowrap;overflow-x:auto;max-width:100%}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--text)}.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh1)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12.5px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:1px solid transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip .lucide{width:13px;height:13px}
.chip.danger{background:var(--danger-soft);color:var(--danger-text)}.chip.warn{background:var(--warn-soft);color:var(--warn-text)}
.chip.ok{background:var(--ok-soft);color:var(--ok-text)}.chip.acc{background:var(--accent-soft);color:var(--accent-text)}
.chip.area{background:none;border-color:var(--border);color:var(--text)}
.chip i.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.x{padding-right:3px}.chip.x button{display:inline-flex;border-radius:4px;color:inherit}.chip.x button:hover{background:var(--hover)}
.field{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0}
.field:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.field input,.field select{border:0;outline:0;background:none;flex:1;min-width:0}.field .lucide{color:var(--icon)}
input::placeholder,textarea::placeholder{color:var(--muted)}
select.sel,input.sel{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 8px;max-width:100%}
.switch{width:34px;height:20px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh1);transition:transform .15s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(14px)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;display:block}

/* task rows */
.trow{display:flex;align-items:center;gap:11px;min-height:40px;padding:5px 8px;border-radius:8px;position:relative}
.trow:hover{background:var(--hover)}
.trow+.trow::before{content:"";position:absolute;left:37px;right:8px;top:0;border-top:1px solid var(--border)}
.trow:hover::before,.trow:hover+.trow::before,.trow.kb::before,.trow.kb+.trow::before{border-color:transparent}
.kb{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.ck{width:18px;height:18px;border-radius:50%;border:1.75px solid var(--pc,var(--border-strong));flex:none;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pc,transparent) 8%,transparent)}
.ck:hover{background:color-mix(in srgb,var(--pc,var(--muted)) 20%,transparent)}
.ck .lucide{width:12px;height:12px;stroke-width:3;opacity:0}
.ck:hover .lucide{opacity:.7;color:var(--pc,var(--muted))}
.ck.on{background:var(--ok);border-color:var(--ok)}.ck.on .lucide{opacity:1;color:#fff}
.p1{--pc:var(--danger)}.p2{--pc:var(--warn)}.p3{--pc:var(--college)}
.tt{flex:1;min-width:0;cursor:pointer}
.tt .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.done .name{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.why{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.why .lucide{width:13px;height:13px}
.group-h{display:flex;align-items:center;gap:8px;margin:18px 0 2px;padding:0 8px;font-weight:600}
.group-h:first-child{margin-top:4px}
.group-h .n{color:var(--muted);font-weight:400;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--icon));flex:none;display:inline-block}
.inline-add{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:8px;color:var(--muted);width:100%}
.inline-add:hover{background:var(--hover);color:var(--accent-text)}
.inline-add .plus{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.subbar{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.subbar span{width:36px;height:4px;border-radius:4px;background:var(--border);position:relative;overflow:hidden}.subbar span i{position:absolute;inset:0 auto 0 0;background:var(--ok)}

/* home grid */
.dash{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:52px;gap:12px;grid-auto-flow:row dense}
.w{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh1);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.wh{display:flex;align-items:center;gap:8px;padding:11px 14px 4px;flex:none}
.wh h2{font-size:14.5px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .wi{color:var(--accent);display:inline-flex}
.wh .meta{font-size:12.5px;color:var(--muted)}
.wb{padding:2px 6px 8px;overflow:auto;flex:1;min-height:0}
.wf{border-top:1px solid var(--border);padding:4px 6px;flex:none;display:flex;gap:4px}
.w.editing{border-style:dashed;border-color:var(--border-strong);cursor:grab}
.w.dragging{opacity:.4}.w.dropto{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wedit{display:flex;gap:2px;align-items:center}
.wedit .size{font-size:12px;font-weight:600;color:var(--muted);height:26px;min-width:30px;padding:0 6px;border-radius:6px;border:1px solid var(--border)}
.wedit .size:hover{color:var(--text);border-color:var(--border-strong)}
.slot{grid-column:span 4;grid-row:span 2;border:1.5px dashed var(--border-strong);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:500}
.slot:hover{border-color:var(--accent-line);color:var(--accent-text);background:var(--accent-soft)}
.gallery{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh2);padding:14px;margin-bottom:14px}
.gallery .gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.gtile{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);border-radius:11px;text-align:left}
.gtile:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.gtile .gi{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex:none}
.gtile b{display:block;font-weight:600}.gtile span span{font-size:13px;color:var(--muted)}
.composer{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh1);padding:8px 8px 8px 14px;margin-bottom:14px;position:relative}
.composer:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft),var(--sh1)}
.composer .row{display:flex;align-items:center;gap:10px}
.composer input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0;height:32px}
.composer .parsed{display:flex;gap:6px;flex-wrap:wrap;padding-left:26px;align-items:center}
.composer .plusic{color:var(--accent)}
.pick{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--muted);border:1px dashed var(--border-strong)}
.pick:hover{color:var(--text);border-style:solid}.pick .lucide{width:13px;height:13px}
.sug{position:absolute;left:30px;top:44px;z-index:40;min-width:270px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh2);padding:5px}
.sug button{display:flex;gap:9px;align-items:center;width:100%;padding:7px 9px;border-radius:7px}
.sug button.on{background:var(--press)}.sug .ctx{margin-left:auto;font-size:12.5px;color:var(--muted);padding-left:12px}
.hint{font-size:12.5px;color:var(--muted)}.hint code{font-family:inherit;background:var(--sunk);border-radius:4px;padding:0 4px;color:var(--text)}
/* life at a glance */
.life{display:grid;grid-template-columns:repeat(4,1fr) 1.15fr;gap:10px;padding:4px 8px 6px;height:100%}
.acell{border:1px solid var(--border);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0;background:var(--surface)}
.acell:hover{border-color:var(--border-strong);background:color-mix(in srgb,var(--surface) 96%,var(--text))}
.acell .top{display:flex;align-items:center;gap:8px;font-weight:600}
.acell .top .cnt{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--muted);white-space:nowrap}
.mg{display:grid;grid-template-columns:1fr 46px;gap:3px 8px;align-items:center;font-size:12.5px}
.mg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.mbar{height:5px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden;display:block}.mbar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px}
.acell .nx{font-size:12.5px;display:flex;gap:6px;align-items:center;margin-top:auto;color:var(--text);white-space:nowrap;overflow:hidden}
.acell .nx .lucide{width:13px;height:13px;color:var(--icon)}
.mecell{background:var(--sunk);border-color:transparent}.mecell:hover{background:var(--sunk);border-color:transparent}
.big{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
/* widgets content */
.rtick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:4px 8px}
.tick{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:1px solid var(--border);background:var(--surface);min-height:50px;transition:background .15s,border-color .15s}
.tick:hover{border-color:var(--border-strong)}
.tick .bub{width:26px;height:26px;border-radius:50%;border:1.75px dashed var(--border-strong);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--icon)}
.tick .bub .lucide{width:14px;height:14px}
.tick.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tick.done .bub{background:var(--ok);border:0;color:#fff}
.tick.skip{background:var(--sunk)}.tick.skip .bub{border-style:solid;color:var(--muted)}
.tick .nm{font-weight:500;line-height:1.25}.tick .st{font-size:12.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.tick.done .st{color:var(--ok-text)}
.tick .st .lucide{width:12px;height:12px;color:var(--warn)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 6px 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:9px;border:1px solid transparent}
.day:hover{background:var(--hover)}.day.on{background:var(--accent-soft);border-color:var(--accent-line)}
.day .dn{font-size:12px;color:var(--muted)}.day .dd{font-size:15px;font-weight:600}.day.on .dd,.day.on .dn{color:var(--accent-text)}

.pace{grid-column:2/4;position:relative;height:7px;border-radius:9px;background:var(--sunk)}
.pace i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--c,var(--accent))}

.lrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;width:100%}.lrow:hover{background:var(--hover)}

.wkbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:100%;min-height:90px;padding:4px 10px}
.wkbars div{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;font-size:12.5px;color:var(--muted)}
.wkbars b{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--ok) 70%,var(--surface))}
.note{width:100%;height:100%;border:0;outline:0;resize:none;background:var(--warn-soft);border-radius:10px;padding:10px 12px;line-height:1.55;color:var(--text)}
/* toolbar + popovers */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:relative}
.toolbar .field{width:220px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh2);padding:8px;min-width:280px;top:calc(100% + 6px)}

.opt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border);font-size:13px}

.prow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;width:100%}
.prow:hover{background:var(--hover)}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 16px;align-items:flex-start;scroll-snap-type:x proximity}
.colm{flex:0 0 272px;background:var(--sunk);border-radius:12px;padding:8px;scroll-snap-align:start;border:1px solid transparent}
.colm.drop{border-color:var(--accent-line);background:var(--accent-soft)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:7px;box-shadow:var(--sh1);cursor:grab;display:block;width:100%}
.card:hover{border-color:var(--border-strong)}.card.dragging{opacity:.4}
.card .ct{display:flex;gap:9px;align-items:flex-start}.card .ct .ck{margin-top:1px}
.card .ctitle{cursor:pointer}
.card .cm{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-left:27px}
.card.done .ctitle{text-decoration:line-through;color:var(--muted)}
.coladd{display:flex;align-items:center;gap:7px;color:var(--muted);height:34px;padding:0 8px;border-radius:8px;width:100%}.coladd:hover{background:var(--hover);color:var(--text)}
.colinput{width:100%;border:1px solid var(--accent-line);border-radius:9px;padding:9px 10px;background:var(--surface);outline:0;box-shadow:0 0 0 3px var(--accent-soft);margin-bottom:6px}
/* calendar layout */
.calw{display:grid;grid-template-columns:1fr 220px;gap:12px}
.cal{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .hdr{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted)}
.cal .hdr div{padding:7px 10px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(104px,auto)}
.cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 6px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}.cell.past{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.cell.drop{background:var(--accent-soft)}
.cell .dn{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px;color:var(--muted)}
.cell .dn b{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text);font-weight:600}
.cell.today .dn b{background:var(--accent);color:var(--accent-ink)}
.cell .add{opacity:0;margin-left:auto}.cell:hover .add,.cell .add:focus-visible{opacity:1}
.cchip{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 6px;border-radius:6px;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;width:100%;min-width:0}
.cchip:hover{background:var(--press)}.cchip.done{text-decoration:line-through;color:var(--muted)}
.cchip .dot{width:7px;height:7px}
.undated{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px;align-self:start}
.undated.drop{background:var(--accent-soft)}
/* timeline (tasks) */
.tl{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow-x:auto}
.tl .g{display:grid;grid-template-columns:220px 1fr;min-width:940px}
.tl .lbl{padding:0 12px;height:38px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--surface);z-index:2}
.tl .trk{position:relative;height:38px;border-bottom:1px solid var(--border);background-image:linear-gradient(to right,var(--border) 1px,transparent 1px);background-size:calc(100%/28) 100%}
.tl .bar{position:absolute;top:7px;height:24px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);font-size:12.5px;padding:0 8px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tl .today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1}
.tl .axis{display:grid;grid-template-columns:repeat(28,1fr);font-size:12px;color:var(--muted);height:38px;align-items:center;border-bottom:1px solid var(--border)}
/* gantt */
.gx{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:auto;position:relative;box-shadow:var(--sh1)}
.gx .gin{position:relative}
.ghead{display:flex;position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--border)}
.gl{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--border);display:grid;grid-template-columns:1fr 66px 52px 56px;align-items:center;flex:none}
.ghead .gl{z-index:7;height:56px;font-size:12.5px;font-weight:600;color:var(--muted)}
.gl>*{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .r{text-align:right;color:var(--muted);font-size:13px}
.gaxis{position:relative;height:56px;flex:none}
.gaxis .mo{position:absolute;top:0;height:28px;display:flex;align-items:center;padding-left:8px;font-size:12.5px;font-weight:600;border-left:1px solid var(--border-strong);white-space:nowrap}

.gaxis .gate{position:absolute;top:31px;transform:translateX(-50%);height:22px;padding:0 8px;border-radius:11px;background:var(--surface);border:1px solid var(--accent-line);color:var(--accent-text);font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;z-index:2}
.gaxis .gate .lucide{width:12px;height:12px}
.grow-r{display:flex;height:38px}

.grow-r.sel .gl{background:var(--accent-soft)}
.gname{display:flex!important;align-items:center;gap:7px}.gname .lucide{width:14px;height:14px;color:var(--icon)}
.gname .tw{display:inline-flex;color:var(--icon);border-radius:4px}
.gt{position:relative;flex:none;border-bottom:1px solid var(--border)}
.gbar{position:absolute;top:8px;height:22px;border-radius:6px;border:1px solid var(--bc);background:var(--bg2);display:flex;align-items:center;cursor:grab;z-index:2;touch-action:none}
.gbar .fill{position:absolute;inset:0 auto 0 0;background:var(--bf);border-radius:5px 0 0 5px}
.gbar .lab{position:relative;padding:0 8px;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center;color:var(--text)}
.gbar .lab .lucide{width:12px;height:12px}
.gbar .rz{position:absolute;right:-1px;top:0;bottom:0;width:8px;cursor:ew-resize;border-radius:0 6px 6px 0}
.gbar .rz:hover{background:color-mix(in srgb,var(--bc) 40%,transparent)}
.gbar.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.gout{position:absolute;top:10px;font-size:12.5px;white-space:nowrap;color:var(--muted);pointer-events:none;z-index:2}
.gms{position:absolute;top:11px;width:16px;height:16px;transform:translateX(-50%) rotate(45deg);border-radius:3px;border:1.5px solid var(--warn);background:var(--warn-soft);z-index:2;cursor:pointer}
.gms.done{background:var(--warn)}.gms.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.gsum{position:absolute;top:15px;height:8px;background:var(--text);opacity:.72;border-radius:2px;z-index:2}

.gsum::before{left:0;border-left-color:var(--text)}.gsum::after{right:0;border-right-color:var(--text)}
.gsvg{position:absolute;pointer-events:none;z-index:1}
.gadd{color:var(--muted);font-size:13px}.gadd:hover{color:var(--accent-text)}
.gx-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.detail{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh1);padding:14px;position:sticky;top:0}
.rmname{width:100%;font-size:17px;font-weight:600;border:0;border-bottom:1px solid transparent;outline:0;background:none;padding:4px 0;margin:8px 0 2px}
.rmname:focus{border-color:var(--accent-line)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:8px 10px;margin:12px 0;font-size:13.5px;align-items:center}

.kv input.sel,.kv select.sel{width:100%}
.legend{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* canvas */
.cv{position:relative;overflow:hidden;height:calc(100vh - 170px);min-height:480px;border:1px solid var(--border);border-radius:14px;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--border-strong) 85%,transparent) 1.2px,transparent 1.2px);touch-action:none;outline:none}

.cn{position:absolute;border-radius:10px;background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--sh1);padding:9px 11px;font-size:13.5px;cursor:move;user-select:none}
.cn.sel{box-shadow:0 0 0 2px var(--accent),var(--sh2)}

.cvbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh2);z-index:5}

.form-grid{display:grid;gap:14px}
.code{width:100%;min-height:330px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--sunk);color:var(--text);resize:vertical;outline:0}

/* area page */
.agrid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:start}

.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--surface)}

.statstrip .v{font-size:20px;font-weight:700;letter-spacing:-.01em}.statstrip .k{font-size:13px;color:var(--muted)}
.gcard{display:grid;grid-template-columns:auto 1fr auto;gap:5px 12px;align-items:center;padding:10px;border-radius:10px;width:100%;border:1px solid var(--border);margin-bottom:8px;background:var(--surface)}

.gcard .gname{font-weight:600}.gcard .sub{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.newgoal{border:1px solid var(--accent-line);border-radius:12px;padding:12px;margin-bottom:10px;background:color-mix(in srgb,var(--accent-soft) 50%,var(--surface));display:grid;gap:10px}
.prog{height:5px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden;width:90px;flex:none}.prog i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--accent))}

.mini-rm .d{background:var(--ok-soft);color:var(--ok-text)}.mini-rm .a{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.mini-rm .l{background:var(--sunk);color:var(--muted)}.mini-rm .lucide{width:13px;height:13px}

.props{display:grid;grid-template-columns:140px 1fr;gap:2px 12px;margin:0 0 18px}
.props dt{color:var(--muted);display:flex;align-items:center;gap:8px;height:34px}.props dt .lucide{color:var(--icon)}
.props dd{margin:0;display:flex;align-items:center;gap:8px;min-height:34px;flex-wrap:wrap}
.pacebig{position:relative;height:12px;border-radius:9px;background:var(--sunk);margin:12px 0 8px}

.mtrack{position:relative;height:66px;margin:6px 10px 0}

.mtrack .fill{position:absolute;left:0;top:15px;border-top:2px solid var(--c)}

.mtrack .m i{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--c);background:var(--surface);border-radius:2px}
.mtrack .m.on i{background:var(--c)}.mtrack .m small{color:var(--muted);font-size:12px;margin-top:-4px}
.doc{font-size:16px;line-height:1.7;max-width:70ch}.doc h2{font-size:20px;margin:26px 0 6px;font-weight:600}.doc p{margin:0 0 12px}.doc ul{padding-left:22px}
.lnk{color:var(--accent-text);text-decoration:none;border-bottom:1px solid var(--accent-line);padding:0 1px;display:inline-flex;align-items:center;gap:3px;line-height:1.3}

.rt-grid{display:grid;grid-template-columns:minmax(300px,370px) 1fr;gap:16px;align-items:start}.rt-grid>*{min-width:0}
.rlist{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh1);overflow:hidden}
.ritem{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.ritem:hover{background:var(--hover)}.ritem.sel{background:var(--accent-soft)}

function parseQuick(text){const out={title:[],due:null,p:4,lb:[],proj:null,area:null,goal:null,tokens:[]};
 text.split(/\s+/).filter(Boolean).forEach(w=>{const lw=w.toLowerCase();let m;
  if(lw==='today'||lw==='tod'){out.due=0;out.tokens.push(['calendar','Today'])}
  else if(lw==='tomorrow'||lw==='tmr'){out.due=1;out.tokens.push(['calendar','Tomorrow'])}
  else if(lw.length>=3&&WDS.some(d=>d.startsWith(lw))){const wd=WDS.findIndex(d=>d.startsWith(lw));const o=(wd-BASE.getDay()+7)%7||7;out.due=o;out.tokens.push(['calendar',dayName(o)])}
  else if(/^p[1-4]$/.test(lw)){out.p=+lw[1];out.tokens.push(['flag','Priority '+lw[1]])}
  else if(/^#\w+/.test(w)){out.lb.push(w.slice(1));out.tokens.push(['hash',w.slice(1)])}
  else if(/^@\w+/.test(w)&&(m=findPlace(lw.slice(1)))){out.proj=m.proj||null;out.area=m.area||out.area;out.tokens.push(['folder',m.label])}
  else if((m=/^(?:~|goal:)(\w+)/.exec(lw))&&findGoal(m[1])){const g=findGoal(m[1]);out.goal=g.id;out.area=out.area||g.area;out.tokens.push(['target',g.n])}

 if((m=/^@(\w*)$/.exec(w)))return [...Object.entries(AREAS).map(([id,a])=>({tok:'@'+id,ic:a.ic,n:a.n,ctx:'Area',c:id})),...Object.entries(PROJECTS).filter(([id])=>id!=='inbox').map(([id,p])=>({tok:'@'+id,ic:'folder',n:p.n,ctx:AREAS[p.area].n,c:p.area}))].filter(x=>!m[1]||x.tok.slice(1).startsWith(m[1].toLowerCase())||x.n.toLowerCase().startsWith(m[1].toLowerCase())).slice(0,7);

 if((m=/^#(\w*)$/.exec(w)))return LABELS.filter(l=>l.startsWith(m[1])).map(l=>({tok:'#'+l,ic:'hash',n:l,ctx:'Label'}));return []}

function screenArea(){const a=S.route.id,A=AREAS[a];const gs=GOALS.filter(g=>g.area===a);const pj=Object.entries(PROJECTS).filter(([k,p])=>p.area===a);const rms=RMS.filter(r=>r.area===a);const open=TASKS.filter(t=>t.area===a&&!t.done);
 const tabs=`<div class="seg" role="tablist">${[['overview','layout-grid','Overview'],['tasks','list-checks','Tasks'],['pages','file-text','Pages']].map(([k,i,l])=>`<button role="tab" aria-selected="${S.area.tab===k}" class="${S.area.tab===k?'on':''}" onclick="S.area.tab='${k}';render()">${ic(i)}${l}</button>`).join('')}</div>`;
 let body;

 else body=`<div class="statstrip"><div><div class="v num">${gs.length}</div><div class="k">Goals · ${gs.filter(g=>g.type!=='Manual'&&!behind(g)).length} on track</div></div><div><div class="v num">${open.length}</div><div class="k">Open tasks</div></div><div><div class="v num" ${open.some(t=>t.due!=null&&t.due<0)?'style="color:var(--danger-text)"':''}>${open.filter(t=>t.due!=null&&t.due<0).length}</div><div class="k">Overdue</div></div><div><div class="v num">${open.filter(t=>t.due!=null&&t.due>=0&&t.due<7).length}</div><div class="k">Due this week</div></div></div>
 <div class="agrid"><section class="panel s8"><h2>Goals <span class="n">${gs.length}</span><span class="acts"><button class="btn sm" onclick="S.area.newGoal={n:'',type:'Count',total:10,target:'${iso(60)}'};S.focus='ngname';render()">${ic('plus')}New goal</button></span></h2>${S.area.newGoal?newGoalForm(a):''}${gs.map(goalCard).join('')||`<div class="empty">${ic('target')}<div>No goals yet. A goal gives tasks something to count toward.</div></div>`}</section>
 <section class="panel s4"><h2>Up next</h2>${open.filter(t=>t.due!=null).sort((x,y)=>x.due-y.due).slice(0,6).map(t=>taskRow(t,{noArea:true,noLabels:true,noGoal:true})).join('')||'<div class="empty">Nothing scheduled.</div>'}<button class="inline-add" onclick="S.qa={text:'@${a} '};S.focus='qain';render()"><span class="plus">${ic('plus')}</span>Add task to ${A.n}</button></section>
 <section class="panel s6"><h2>Projects <span class="n">${pj.length}</span><span class="acts"><button class="btn ghost sm" onclick="toast('Project created')">${ic('plus')}New project</button></span></h2>${pj.map(([k,p])=>{const ts=TASKS.filter(t=>t.proj===k);const d=ts.filter(t=>t.done).length;return `<button class="lrow" onclick="go('project','${k}')">${ic('folder')}<span class="grow">${p.n}</span><span class="m num">${ts.length-d} open</span><span class="prog" style="--c:${areaC(a)}"><i style="width:${ts.length?d/ts.length*100:0}%"></i></span></button>`}).join('')||'<div class="empty">No projects.</div>'}</section>
 <section class="panel s6"><h2>Roadmaps <span class="n">${rms.length}</span><span class="acts"><button class="btn ghost sm" onclick="S.rmnew.area='${a}';go('rmnew')">${ic('plus')}New roadmap</button></span></h2>${rms.map(r=>`<button class="lrow" style="display:block" onclick="go('roadmap','${r.id}')"><span style="display:flex;gap:8px;align-items:center">${ic('chart-gantt')}<span class="grow" style="font-weight:500">${r.n}</span><span class="m">${sd(rmSpan(r)[0])} – ${sd(rmSpan(r)[1])}</span></span>${miniRm(r)}</button>`).join('')||`<div class="empty">No roadmaps. Build a 30-day one or paste Mermaid code.</div>`}</section></div>`;
 return `<div class="wrap"><div class="ph"><div class="grow title-ic">${adot(a)}<div><h1>${A.n}</h1><div class="lead">${A.about}</div></div></div><div class="acts">${tabs}</div></div>${body}</div>`}
function screenGoals(){const f=S.goals.f;const list=GOALS.filter(g=>f==='all'||(f==='behind'?behind(g):f==='track'?g.type!=='Manual'&&!behind(g):g.type==='Manual'));
 return `<div class="wrap narrow"><div class="ph"><div class="grow title-ic">${adot(null,'target')}<div><h1>Goals</h1><div class="lead">${GOALS.length} goals across ${Object.keys(AREAS).length} Areas</div></div></div></div>
 <div class="toolbar"><div class="seg">${[['all','All'],['behind','Behind pace'],['track','On track'],['manual','Manual']].map(([k,l])=>`<button class="${f===k?'on':''}" onclick="S.goals.f='${k}';render()">${l}</button>`).join('')}</div></div>
 ${Object.entries(AREAS).map(([a,A])=>{const gs=list.filter(g=>g.area===a);return gs.length?`<div class="group-h">${adot(a)}<button onclick="go('area','${a}')">${A.n}</button><span class="n">${gs.length}</span><span class="grow"></span><button class="btn ghost sm" onclick="S.area.tab='overview';S.area.newGoal={n:'',type:'Count',total:10,target:'${iso(60)}'};S.focus='ngname';go('area','${a}')">${ic('plus')}New goal</button></div>${gs.map(goalCard).join('')}`:''}).join('')}</div>`}
function screenRoadmaps(){return `<div class="wrap narrow"><div class="ph"><div class="grow title-ic">${adot(null,'chart-gantt')}<div><h1>Roadmaps</h1><div class="lead">Gantt plans with gated phases</div></div></div><div class="acts"><button class="btn" onclick="S.rmnew.tab='import';go('rmnew')">${ic('clipboard-paste')}Import code</button><button class="btn primary" onclick="S.rmnew.tab='build';go('rmnew')">${ic('plus')}New roadmap</button></div></div>
 ${RMS.map(r=>{const its=r.items.filter(i=>i.d>0);const pc=its.length?Math.round(its.reduce((s,i)=>s+i.pct,0)/its.length):0;return `<button class="panel" style="display:block;width:100%;text-align:left" onclick="go('roadmap','${r.id}')"><div class="h2">${adot(r.area,'chart-gantt')}${esc(r.n)}<span class="n">${AREAS[r.area].n}${r.goal&&G(r.goal)?' · '+G(r.goal).n:''}</span><span class="acts hint num">${sd(rmSpan(r)[0])} – ${sd(rmSpan(r)[1])} · ${pc}% done</span></div>${miniRm(r)}</button>`}).join('')}</div>`}

// ===== roadmap model =====
const item=(rm,id)=>rm.items.find(i=>i.id===id);
function phaseSpan(rm,p){const its=rm.items.filter(i=>i.ph===p.id);if(!its.length)return [0,1];return [Math.min(...its.map(i=>i.s)),Math.max(...its.map(i=>i.s+i.d))]}
function rmSpan(rm){return [Math.min(...rm.items.map(i=>i.s)),Math.max(...rm.items.map(i=>i.s+i.d))]}
function phaseState(rm,p){const its=rm.items.filter(i=>i.ph===p.id);if(its.length&&its.every(i=>i.pct>=100))return 'done';if(p.gate&&item(rm,p.gate)&&item(rm,p.gate).pct<100)return 'locked';return phaseSpan(rm,p)[0]<=0?'active':'todo'}
function itemState(rm,i){if(i.pct>=100)return 'done';const p=rm.phases.find(x=>x.id===i.ph);if(p&&phaseState(rm,p)==='locked')return 'locked';if(i.s+i.d<0)return 'late';if(i.s<=0)return 'active';return 'todo'}
function miniRm(rm){return `<div class="mini-rm">${rm.phases.map(p=>{const st=phaseState(rm,p);const [a,b]=phaseSpan(rm,p);return `<div class="${st==='done'?'d':st==='active'?'a':'l'}" style="flex:${Math.max(b-a,3)}" title="${esc(p.n)}">${ic(st==='done'?'check':st==='active'?'circle-dot':st==='locked'?'lock':'circle')}${esc(p.n)}</div>`}).join('')}</div>`}
const STC={done:['var(--ok-soft)','var(--ok)','var(--ok)'],active:['var(--accent-soft)','var(--accent)','var(--accent)'],todo:['var(--surface)','var(--border-strong)','var(--icon)'],late:['var(--danger-soft)','var(--danger)','var(--danger)'],locked:['repeating-linear-gradient(45deg,var(--sunk) 0 5px,var(--surface) 5px 10px)','var(--border-strong)','var(--icon)']};

// ===== gantt =====
const PPD={day:30,week:12,month:5};
function ganttHTML(rm,o={}){const ppd=o.ppd||PPD[S.rm.zoom];const [a0,b0]=rmSpan(rm);const A=a0-3,B=b0+6;const Wd=(B-A)*ppd;const X=d=>(d-A)*ppd;const LW=o.mini?200:(S.device==='phone'?150:380);S._LW=LW;const RH=38;
 const rows=[];rm.phases.forEach(p=>{rows.push({k:'ph',p});if(o.mini||!S.rm.collapsed[rm.id+p.id])rm.items.filter(i=>i.ph===p.id).sort((x,y)=>x.s-y.s).forEach(i=>rows.push({k:'it',i}));if(!o.mini&&!S.rm.collapsed[rm.id+p.id])rows.push({k:'add',p})});
 const yOf={};rows.forEach((r,ix)=>{if(r.k==='it')yOf[r.i.id]=ix*RH+RH/2});
 let axis='';for(let d=A;d<B;d++){const D=dt(d);if(D.getDate()===1||d===A)axis+=`<div class="mo" style="left:${X(d)}px">${fmt(d,{month:'long',year:d===A?'numeric':undefined})}</div>`;
  if(ppd>=20)axis+=`<div class="dy ${d===0?'td':''}" style="left:${X(d)}px;width:${ppd}px">${D.getDate()}</div>`;else if(D.getDay()===1)axis+=`<div class="dy ${d>=0&&d<7?'td':''}" style="left:${X(d)}px;width:${ppd*7}px;justify-content:flex-start;padding-left:4px">${D.getDate()}</div>`}
 rm.phases.filter(p=>p.gate).forEach(p=>{const st=phaseState(rm,p);axis+=`<div class="gate" style="left:${X(phaseSpan(rm,p)[0])}px" title="${esc(p.n)} opens when ${esc(item(rm,p.gate)?.n)} is done">${ic(st==='locked'?'lock':'lock-open')}Gate</div>`});
 const H=rows.length*RH;let svg=`<svg class="gsvg" style="left:${LW}px;top:57px" width="${Wd}" height="${H}" aria-hidden="true"><defs><marker id="ga${o.mini?'m':''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="var(--icon)"/></marker><marker id="gad${o.mini?'m':''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="var(--danger)"/></marker></defs>`;
 if(ppd>=12)for(let d=A;d<B;d++){if(dt(d).getDay()===6)svg+=`<rect x="${X(d)}" y="0" width="${ppd*2}" height="${H}" fill="var(--sunk)" opacity=".75"/>`;if(ppd>=20)svg+=`<line x1="${X(d)}" x2="${X(d)}" y1="0" y2="${H}" stroke="var(--border)" stroke-width="1" opacity=".55"/>`}
 rm.phases.filter(p=>p.gate).forEach(p=>{const x=X(phaseSpan(rm,p)[0]);svg+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--accent)" stroke-dasharray="5 5" stroke-width="1.5" opacity=".7"/>`});
 rm.items.forEach(it=>(it.dep||[]).forEach(dp=>{const a=item(rm,dp);if(!a||yOf[a.id]==null||yOf[it.id]==null)return;const x1=X(a.s+a.d)+(a.d===0?8:0),y1=yOf[a.id],x2=X(it.s)-(it.d===0?9:1),y2=yOf[it.id];const bad=it.s<a.s+a.d;
  const path=x2-x1>=14?`M${x1} ${y1}H${x1+7}V${y2}H${x2}`:`M${x1} ${y1}H${x1+7}V${y2+(y2>y1?-RH/2+2:RH/2-2)}H${x2-10}V${y2}H${x2}`;svg+=`<path d="${path}" fill="none" stroke="${bad?'var(--danger)':'var(--icon)'}" stroke-width="1.4" marker-end="url(#${bad?'gad':'ga'}${o.mini?'m':''})" ${itemState(rm,it)==='locked'?'stroke-dasharray="4 3"':''}/>`}));
 svg+=`<line x1="${X(0)+ppd/2}" x2="${X(0)+ppd/2}" y1="0" y2="${H}" stroke="var(--accent)" stroke-width="2"/></svg>`;
 const body=rows.map(r=>{
  if(r.k==='ph'){const [a,b]=phaseSpan(rm,r.p);const st=phaseState(rm,r.p);const its=rm.items.filter(i=>i.ph===r.p.id&&i.d>0);const pc=its.length?Math.round(its.reduce((s,i)=>s+i.pct,0)/its.length):0;const col=!!S.rm.collapsed[rm.id+r.p.id];
   return `<div class="grow-r phr"><div class="gl" style="width:px"><span class="gname">${o.mini?'':`<button class="tw" onclick="S.rm.collapsed['${rm.id+r.p.id}']=${!col};render()" aria-label="${col?'Expand':'Collapse'} ${esc(r.p.n)}">${ic(col?'chevron-right':'chevron-down')}</button>`}${ic(st==='done'?'circle-check':st==='locked'?'lock':st==='active'?'circle-dot':'circle')}${esc(r.p.n)}</span>${o.mini?'':`<span class="r num">${sd(a)}</span><span class="r num">${b-a}d</span><span class="r num">${pc}%</span>`}</div><div class="gt" style="width:${Wd}px;height:${RH}px"><div class="gsum" style="left:${X(a)}px;width:${Math.max((b-a)*ppd,6)}px"></div><span class="gout" style="left:${X(b)+8}px">${pc}%${st==='locked'&&!o.mini?` · locked until ${esc(item(rm,r.p.gate).n)}`:''}</span></div></div>`}
  if(r.k==='add')return `<div class="grow-r"><div class="gl" style="width:px"><button class="gadd gname" style="padding-left:30px" onclick="rmAddStep('${rm.id}','${r.p.id}')">${ic('plus')}Add step</button></div><div class="gt" style="width:${Wd}px;height:${RH}px"></div></div>`;
  const it=r.i;const st=itemState(rm,it);const [bg,bc,bf]=STC[st];const sel=S.rm.sel===it.id&&!o.mini;const fits=it.d*ppd>110;
  const bar=it.d===0?`<button class="gms ${it.pct>=100?'done':''} ${sel?'sel':''}" style="left:${X(it.s)}px" ${o.mini?'tabindex="-1"':`onclick="rmSel('${it.id}')"`} aria-label="Milestone ${esc(it.n)} ${sd(it.s)}"></button><span class="gout" style="left:${X(it.s)+14}px;color:var(--text);font-weight:500">${esc(it.n)}</span>`
   :`<div class="gbar ${sel?'sel':''}" ${o.mini?'':`tabindex="0" role="button" aria-label="${esc(it.n)}, ${sd(it.s)} to ${sd(it.s+it.d)}, ${it.pct}% done. Arrow keys move, Shift plus arrows resize." onpointerdown="barDown(event,'${rm.id}','${it.id}')" onkeydown="barKey(event,'${rm.id}','${it.id}')"`} style="left:${X(it.s)}px;width:${it.d*ppd}px;--bg2:${bg};--bc:${bc};--bf:${st==='done'?'transparent':`color-mix(in srgb,${bf} 28%,transparent)`}"><span class="fill" style="width:${it.pct}%"></span><span class="lab">${st==='locked'?ic('lock'):st==='done'?ic('check'):''}${fits?esc(it.n):''}</span>${o.mini?'':'<span class="rz" data-rz="1"></span>'}</div>${fits?'':`<span class="gout" style="left:${X(it.s+it.d)+8}px">${esc(it.n)}</span>`}`;
  return `<div class="grow-r ${sel?'sel':''}"><div class="gl" style="width:px"><span class="gname" style="padding-left:${o.mini?14:30}px;cursor:pointer" ${o.mini?'':`onclick="rmSel('${it.id}')"`}>${ic(it.d===0?'diamond':'minus')}${esc(it.n)}</span>${o.mini?'':`<span class="r num">${sd(it.s)}</span><span class="r num">${it.d?it.d+'d':''}</span><span class="r num">${it.d?it.pct+'%':''}</span>`}</div><div class="gt" style="width:${Wd}px;height:${RH}px">${bar}</div></div>`}).join('');
 return `<div class="gx" ${o.mini?'style="max-height:420px"':'id="gx" style="max-height:calc(100vh - 220px)"'}><div class="gin" style="width:${LW+Wd}px">
 <div class="ghead"><div class="gl" style="width:px"><span>Step</span>${o.mini?'':'<span class="r">Start</span><span class="r">Days</span><span class="r">Done</span>'}</div><div class="gaxis" style="width:${Wd}px">${axis}</div></div>${svg}${body}</div></div>`}
function rmDetail(rm){const it=item(rm,S.rm.sel);if(!it)return `<aside class="detail"><div class="empty">${ic('mouse-pointer-click')}<div>Select a bar to edit its dates, progress and dependencies. Drag a bar to move it, or drag its right edge to resize.</div></div></aside>`;
 const st=itemState(rm,it);const ph=rm.phases.find(p=>p.id===it.ph);const others=rm.items.filter(i=>i.id!==it.id&&!(it.dep||[]).includes(i.id));
 return `<aside class="detail" aria-label="Step details"><div style="display:flex;align-items:center;gap:6px">${chip({done:'Done',active:'In progress',todo:'Up next',late:'Late',locked:'Locked'}[st],{done:'ok',active:'acc',late:'danger'}[st]||'',st==='locked'?'lock':it.d===0?'diamond':'circle-dot')}<span class="grow"></span><button class="ibtn sm" onclick="S.rm.sel=null;render()" aria-label="Close details">${ic('x')}</button></div>
 <label class="sr" for="rmname">Step name</label><input id="rmname" class="rmname" value="${esc(it.n)}" onchange="rmSet('${rm.id}','${it.id}','n',this.value)">
 <dl class="kv"><dt>Phase</dt><dd><select class="sel" onchange="rmSet('${rm.id}','${it.id}','ph',this.value)">${rm.phases.map(p=>`<option value="${p.id}" ${p.id===it.ph?'selected':''}>${esc(p.n)}</option>`).join('')}</select></dd>
 <dt>Start</dt><dd><input type="date" class="sel" value="${iso(it.s)}" onchange="rmSet('${rm.id}','${it.id}','s',fromIso(this.value))" aria-label="Start date"></dd>
 <dt>Duration</dt><dd><input type="number" class="sel" min="0" value="${it.d}" onchange="rmSet('${rm.id}','${it.id}','d',+this.value)" aria-label="Duration in days"></dd>
 ${it.d?`<dt>Progress</dt><dd style="display:flex;gap:8px;align-items:center"><input type="range" min="0" max="100" step="5" value="${it.pct}" oninput="this.nextElementSibling.textContent=this.value+'%'" onchange="rmSet('${rm.id}','${it.id}','pct',+this.value)" style="flex:1;accent-color:var(--accent)" aria-label="Progress"><span class="num" style="width:38px">${it.pct}%</span></dd>`:''}
 <dt>Needs</dt><dd>${(it.dep||[]).map(d=>`<span class="chip x" style="margin:0 4px 4px 0">${esc(item(rm,d)?.n)}<button onclick="rmDep('${rm.id}','${it.id}','${d}',false)" aria-label="Remove dependency">${ic('x')}</button></span>`).join('')}<select class="sel" style="width:100%" onchange="if(this.value)rmDep('${rm.id}','${it.id}',this.value,true)" aria-label="Add dependency"><option value="">Add dependency…</option>${others.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></dd>
 ${ph.gate?`<dt>Gate</dt><dd>${esc(ph.n)} opens when <b>${esc(item(rm,ph.gate)?.n)}</b> is done</dd>`:''}</dl>
 ${st==='locked'?`<div class="callout" style="margin:0 0 10px">${ic('lock')}<div>Locked by its gate. You can still plan the dates.</div></div>`:''}
 <div class="acts"><button class="btn ${it.pct>=100?'':'primary'}" style="flex:1;justify-content:center" ${st==='locked'?'disabled':''} onclick="rmSet('${rm.id}','${it.id}','pct',${it.pct>=100?0:100})">${ic(it.pct>=100?'rotate-ccw':'check')}${it.pct>=100?'Reopen':'Mark done'}</button><button class="ibtn" onclick="rmDel('${rm.id}','${it.id}')" aria-label="Delete step">${ic('trash-2')}</button></div></aside>`}

function buildCanvas(rm){const nodes=[],edges=[];rm.phases.forEach((p,i)=>{const its=rm.items.filter(x=>x.ph===p.id).sort((a,b)=>a.s-b.s);const fid='f'+p.id;nodes.push({id:fid,k:'frame',x:i*330,y:0,w:300,h:76+its.length*72,text:p.n,ph:p.id});
  its.forEach((it,j)=>nodes.push({id:'n'+it.id,k:'step',x:i*330+16,y:62+j*72,w:268,h:58,ref:it.id,parent:fid}))});
 rm.items.forEach(it=>(it.dep||[]).forEach(d=>edges.push(['n'+d,'n'+it.id])));
 nodes.push({id:uid('c'),k:'sticky',x:rm.phases.length*330+10,y:0,w:220,h:110,text:'Drop ideas here. Double-click the canvas to add a note.'});
 rm.canvas={nodes,edges,pan:{x:40,y:80},z:.85}}
function canvasNodeHTML(rm,n){const sel=S.rm.cvSel===n.id||S.rm.edgeFrom===n.id;const style=`left:${n.x}px;top:${n.y}px;width:${n.w}px;${n.k==='frame'?`height:${n.h}px`:'min-height:'+(n.h||40)+'px'}`;

function parseRoadmap(code,start=0){const lines=code.split('\n');const errs=[];const first=(lines.find(l=>l.trim()&&!l.trim().startsWith('%%'))||'').trim();let r;
 if(/^gantt\b/i.test(first))r=parseGantt(lines,errs);else if(/^(flowchart|graph)\b/i.test(first))r=parseFlow(lines,errs,start);
 else return {errs:[first?`Line 1: start with “gantt” or “flowchart LR”, found “${first.slice(0,30)}”.`:'Paste Mermaid gantt or flowchart code.']};
 if(!r.errs.length)withGates(r.phases,r.items);return r}
function parseGantt(lines,errs){let title='Imported roadmap';const phases=[],items=[];let cur=null,last=null,auto=0;
 lines.forEach((raw,ix)=>{const l=raw.trim();const ln=ix+1;if(!l||l.startsWith('%%')||/^gantt$/i.test(l)||/^(dateFormat|axisFormat|excludes|todayMarker|tickInterval|weekday)\b/i.test(l))return;
  let m;if((m=/^title\s+(.+)/i.exec(l))){title=m[1];return}
  if((m=/^section\s+(.+)/i.exec(l))){cur={id:'ph'+phases.length,n:m[1]};phases.push(cur);return}
  const ci=l.indexOf(':');if(ci<0){errs.push(`Line ${ln}: expected “Name : id, start, duration”.`);return}
  if(!cur){cur={id:'ph0',n:'Phase 1'};phases.push(cur)}
  const name=l.slice(0,ci).trim();const parts=l.slice(ci+1).split(',').map(s=>s.trim()).filter(Boolean);const tags=[];while(parts.length&&/^(done|active|crit|milestone)$/i.test(parts[0]))tags.push(parts.shift().toLowerCase());
  let id,startS,durS;if(parts.length>=3)[id,startS,durS]=parts;else if(parts.length===2)[startS,durS]=parts;else if(parts.length===1)durS=parts[0];
  id=id||'t'+(++auto);let s,dep=[];
  if(!startS){if(!last){errs.push(`Line ${ln}: the first step needs a start date.`);return}s=last.s+last.d;dep=[last.id]}
  else if((m=/^after\s+(.+)/i.exec(startS))){dep=m[1].split(/\s+/);const ps=dep.map(x=>items.find(i=>i.id===x));if(ps.some(x=>!x)){errs.push(`Line ${ln}: “after ${m[1]}” refers to an id that isn’t defined above.`);return}s=Math.max(...ps.map(p=>p.s+p.d))}
  else{s=fromIso(startS);if(s==null){errs.push(`Line ${ln}: start “${startS}” must be YYYY-MM-DD or “after id”.`);return}}
  let d;if(tags.includes('milestone'))d=0;else if((m=/^(\d+)([dw])$/i.exec(durS||'')))d=+m[1]*(m[2].toLowerCase()==='w'?7:1);else if(fromIso(durS)!=null)d=fromIso(durS)-s;else{errs.push(`Line ${ln}: duration “${durS||''}” must look like 4d, 2w or an end date.`);return}
  const it={id,n:name,ph:cur.id,s,d,pct:tags.includes('done')?100:tags.includes('active')?30:0,dep};items.push(it);last=it});
 if(!items.length&&!errs.length)errs.push('No steps found. Each step is “Name : id, start, duration”.');
 return {title,phases:phases.filter(p=>items.some(i=>i.ph===p.id)),items,errs}}
function parseFlow(lines,errs,start){const nodes={},order=[],edges=[],phases=[];let cur=null;
 const node=(tok,ln)=>{const m=/^([A-Za-z0-9_]+)\s*(?:\[([^\]]*)\]|\(([^)]*)\)|\{([^}]*)\})?$/.exec(tok.trim());if(!m){errs.push(`Line ${ln}: couldn’t read node “${tok.trim()}”.`);return null}
  const id=m[1];const label=m[2]??m[3]??m[4];if(!nodes[id]){nodes[id]={id,n:id,ph:cur?cur.id:null,d:3};order.push(id)}const N=nodes[id];
  if(label!=null){let lab=label.trim();const dm=/\s*[·(]\s*(\d+)\s*d\)?\s*$/.exec(lab);if(dm){N.d=+dm[1];lab=lab.slice(0,dm.index).trim()}N.n=lab;if(m[4]!=null)N.d=0}
  if(cur&&!N.ph)N.ph=cur.id;return id};
 lines.forEach((raw,ix)=>{const l=raw.trim();const ln=ix+1;if(!l||l.startsWith('%%')||/^(flowchart|graph)\b/i.test(l))return;let m;
  if((m=/^subgraph\s+(.+)/i.exec(l))){cur={id:'ph'+phases.length,n:m[1].replace(/^\w+\[(.*)\]$/,'$1')};phases.push(cur);return}
  if(/^end$/i.test(l)){cur=null;return}
  if(/^(classDef|class|style|linkStyle|click)\b/.test(l))return;
  const ids=l.split(/\s*(?:-->|==>|-\.->|---)\s*/).map(p=>node(p,ln));for(let i=1;i<ids.length;i++)if(ids[i-1]&&ids[i])edges.push([ids[i-1],ids[i]])});
 if(!order.length){errs.push('No nodes found.');return {errs}}
 if(order.some(id=>!nodes[id].ph)){const p={id:'ph'+phases.length,n:phases.length?'Other steps':'Steps'};phases.push(p);order.forEach(id=>{if(!nodes[id].ph)nodes[id].ph=p.id})}
 const items=[];const done=new Set();let guard=0;while(done.size<order.length&&guard++<500){order.forEach(id=>{if(done.has(id))return;const deps=edges.filter(e=>e[1]===id).map(e=>e[0]);if(deps.every(d=>done.has(d))){const s=deps.length?Math.max(...deps.map(d=>{const it=items.find(i=>i.id===d);return it.s+it.d})):start;items.push({id,n:nodes[id].n,ph:nodes[id].ph,s,d:nodes[id].d,pct:0,dep:deps});done.add(id)}})}
 if(done.size<order.length)errs.push('The graph has a cycle, so the steps can’t be ordered in time.');
 return {title:'Imported roadmap',phases:phases.filter(p=>items.some(i=>i.ph===p.id)),items,errs}}
function withGates(phases,items){phases.forEach((p,i)=>{if(i===0)return;const prev=items.filter(x=>x.ph===phases[i-1].id&&x.d===0).sort((a,b)=>b.s-a.s)[0];if(prev)p.gate=prev.id})}
function buildSkeleton(N){const phases=[],items=[];const L=N.len,n=N.phases;const weekly=L<=35&&n===Math.max(1,Math.round(L/7));let prevMs=null;
 for(let i=0;i<n;i++){const s=N.start+Math.floor(i*L/n),e=N.start+Math.floor((i+1)*L/n);const pid='ph'+i;phases.push({id:pid,n:weekly?`Week ${i+1}`:`Phase ${i+1}`});
  const a={id:'s'+i,n:weekly?`Week ${i+1} focus`:`Phase ${i+1} work`,ph:pid,s,d:Math.max(1,e-s-(N.gates?1:0)),pct:0,dep:prevMs?[prevMs]:[]};items.push(a);
  if(N.gates){const ms={id:'m'+i,n:i===n-1?'Finish line':`Checkpoint ${i+1}`,ph:pid,s:e-1,d:0,pct:0,dep:[a.id]};items.push(ms);prevMs=ms.id}else prevMs=a.id}

function best(r){let b=0,c=0;r.hist.forEach(v=>{if(v===null)return;if(v==='d'){c++;b=Math.max(b,c)}else c=0});return Math.max(b,streak(r))}
function rate(r,n){const xs=r.hist.slice(-n).filter(v=>v!==null);return xs.length?Math.round(xs.filter(v=>v==='d').length/xs.length*100):0}
function heatmap(r,weeks){const first=-(weeks*7);const startOff=first-((dt(first).getDay()+6)%7);let cells='';const months=[];const cols=Math.ceil((7-startOff)/7);
 for(let o=startOff,col=0;o<=6;o+=7,col++){if(dt(o).getDate()<=7)months.push([col,fmt(o,{month:'short'})]);for(let k=0;k<7;k++){const d=o+k;let cls='fu',lab='';if(d<=0&&d>=-182){const v=d===0?r.today:r.hist[182+d];cls=v==null?'':v==='d'?['l1','l2','l3'][Math.floor((r.intensity[Math.max(0,182+d-1)]??.5)*3)]:v==='s'?'sk':'';lab=`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: ${v==null?'not scheduled':v==='d'?'done':v==='s'?'skipped':'missed'}`}else if(d<0)cls='';cells+=`<i class="${cls}" ${lab?`title="${lab}"`:''}></i>`}}
 return `<div style="overflow-x:auto"><div class="months" style="grid-template-columns:repeat(${cols},16px)">${[...Array(cols)].map((_,c)=>`<span>${months.find(m=>m[0]===c)?.[1]||''}</span>`).join('')}</div><div class="heat" role="img" aria-label="${esc(r.n)} check-ins, ${rate(r,weeks*7)} percent of scheduled days done">${cells}</div></div>`}
function routineStats(r){const total=r.hist.filter(v=>v==='d').length+(r.today==='d'?1:0);
 const wd=[1,2,3,4,5,6,0].map(d=>{const xs=r.hist.map((v,i)=>[v,dt(i-182).getDay()]).filter(([v,w])=>w===d&&v!==null);return xs.length?Math.round(xs.filter(([v])=>v==='d').length/xs.length*100):0});
 return `<div class="statstrip"><div><div class="v num">${streak(r)}</div><div class="k">Current streak</div></div><div><div class="v num">${best(r)}</div><div class="k">Best streak</div></div><div><div class="v num">${rate(r,30)}%</div><div class="k">Last 30 days</div></div><div><div class="v num">${total}</div><div class="k">Check-ins</div></div></div>
 <section class="panel"><h2>Last six months</h2>${heatmap(r,26)}<div class="legend" style="margin-top:10px"><span><i style="background:var(--sunk);border-color:var(--border)"></i>Missed</span><span><i style="background:var(--border-strong);border:0;opacity:.6"></i>Skipped</span><span><i style="background:color-mix(in srgb,var(--ok) 35%,var(--surface));border:0"></i><i style="background:var(--ok);border:0;margin-left:-4px"></i>Done</span></div></section>
 <div class="two"><section class="panel"><h2>By weekday</h2><div class="wkbars" style="height:120px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div><span class="num" style="color:var(--text)">${wd[i]?wd[i]+'%':'–'}</span><b style="height:${wd[i]*.7+2}px"></b>${d}</div>`).join('')}</div></section>
 <section class="panel"><h2>Trend</h2><dl class="kv" style="margin:4px 0 0"><dt>7 days</dt><dd class="num">${rate(r,7)}%</dd><dt>30 days</dt><dd class="num">${rate(r,30)}%</dd><dt>90 days</dt><dd class="num">${rate(r,90)}%</dd><dt>Counts toward</dt><dd>${r.goal?`<button class="lnk" onclick="go('goal','${r.goal}')">${ic('target')}${G(r.goal).n}</button>`:'No goal'}</dd><dt>Reminder</dt><dd>${r.time||'None'}</dd></dl></section></div>`}

const TOK=[[/^p([1-4])$/,m=>['flag','Priority '+m[1],t=>t.p==+m[1],{prio:+m[1]}]],[/^#(\w+)$/,m=>['hash','#'+m[1],t=>t.lb?.includes(m[1]),{lb:m[1]}]],[/^due:(today|week|overdue)$/,m=>['calendar','Due '+m[1],t=>t.due!=null&&(m[1]==='today'?t.due===0:m[1]==='week'?t.due>=0&&t.due<7:t.due<0),{due:{today:'Today',week:'This week',overdue:'Overdue'}[m[1]]}]],[/^is:(done|open)$/,m=>['circle-check',m[1]==='done'?'Completed':'Open',t=>m[1]==='done'?t.done:!t.done,{}]],[/^in:(\w+)$/,m=>['folder','In '+m[1],t=>(t.area||'').startsWith(m[1])||(t.proj||'').startsWith(m[1]),{}]],[/^~(\w+)$/,m=>['target','Goal '+m[1],t=>(t.goal||'').startsWith(m[1]),{}]]];
function fuzzy(q,s){if(!q)return [1,esc(s)];const L=s.toLowerCase();let i=0,score=0,out='',last=-2;for(let j=0;j<s.length;j++){if(i<q.length&&L[j]===q[i]){score+=j===last+1?3:1;if(j===0||s[j-1]===' ')score+=2;last=j;i++;out+=`<mark>${esc(s[j])}</mark>`}else out+=esc(s[j])}return i===q.length?[score,out]:null}
const ACTIONS=[['plus','New task','Q',"S.pal=null;S.qa={text:''};S.focus='qain'"],['sun','Go to Today','G T',"S.pal=null;go('today')"],['calendar-days','Go to Upcoming','G U',"S.pal=null;go('upcoming')"],['target','New goal','',"S.pal=null;S.area.newGoal={n:'',type:'Count',total:10,target:iso(60)};S.area.tab='overview';S.focus='ngname';go('area','career')"],['chart-gantt','New 30-day roadmap','',"S.pal=null;S.rmnew.tab='build';S.rmnew.len=30;S.rmnew.phases=4;go('rmnew')"],['clipboard-paste','Import roadmap code','',"S.pal=null;S.rmnew.tab='import';go('rmnew')"],['layout-dashboard','Add widget to Home','',"S.pal=null;S.home.gallery=true;go('home')"],['keyboard','Keyboard shortcuts','?',"S.pal=null;S.help=true"],['sun-moon','Toggle light and dark','',"S.pal=null;S.theme=S.theme==='dark'?'light':'dark'"]];
function palResults(){const P_=S.pal;let words=P_.q.trim().split(/\s+/).filter(Boolean);let scope=P_.scope;if(P_.q.startsWith('>')){scope='actions';words=[P_.q.slice(1).trim()].filter(Boolean)}
 const toks=[],rest=[];words.forEach(w=>{const hit=TOK.map(([re,f])=>{const m=w.toLowerCase().match(re);return m&&f(m)}).find(Boolean);hit?toks.push(hit):rest.push(w)});const q=rest.join(' ').toLowerCase();

  add('actions','Actions',ACTIONS.map(a=>[fuzzy(q,a[1]),a]).filter(x=>x[0]).map(([[,h],a])=>({ic:a[0],h,ctx:a[2]||'Action',run:a[3]})))}

function rmSet(rid,iid,k,v){const rm=RM_(rid),it=item(rm,iid);if(v==null||(typeof v==='number'&&isNaN(v)))return;it[k]=v;rm.canvas=null;if(k==='pct'&&v>=100)toast(`${it.n} done${rm.phases.some(p=>p.gate===iid)?' · gate opened':''}`);render()}
function rmDep(rid,iid,d,on){const it=item(RM_(rid),iid);it.dep=it.dep||[];if(on&&!it.dep.includes(d))it.dep.push(d);if(!on)it.dep=it.dep.filter(x=>x!==d);RM_(rid).canvas=null;render()}
function rmDel(rid,iid){const rm=RM_(rid);const i=rm.items.findIndex(x=>x.id===iid);const [it]=rm.items.splice(i,1);rm.items.forEach(x=>x.dep=(x.dep||[]).filter(d=>d!==iid));rm.phases.forEach(p=>{if(p.gate===iid)delete p.gate});S.rm.sel=null;rm.canvas=null;toast(`Deleted ${it.n}`);render()}
function rmAddStep(rid,pid){const rm=RM_(rid);const its=rm.items.filter(i=>i.ph===pid);const last=[...its].sort((a,b)=>(b.s+b.d)-(a.s+a.d))[0];const s=last?last.s+last.d:0;const it={id:uid('s'),n:'New step',ph:pid,s,d:3,pct:0,dep:last?[last.id]:[]};rm.items.push(it);rm.canvas=null;S.rm.sel=it.id;S.focus='rmname';render();document.getElementById('rmname')?.select()}
function rmAddPhase(rid){const rm=RM_(rid);const pid=uid('ph');const end=rmSpan(rm)[1];rm.phases.push({id:pid,n:`Phase ${rm.phases.length+1}`});const it={id:uid('s'),n:'First step',ph:pid,s:end,d:5,pct:0,dep:[]};rm.items.push(it);rm.canvas=null;S.rm.sel=it.id;S.focus='rmname';render();document.getElementById('rmname')?.select()}
function createRm(r,name){if(!r||r.errs?.length||!r.items?.length)return;const N=S.rmnew;const rm={id:uid('rm'),n:name||r.title||'Imported roadmap',area:N.area,goal:N.goal||null,phases:r.phases,items:r.items};RMS.push(rm);S.rm.sel=null;S.rm.view='gantt';toast(`Created ${rm.n}`);go('roadmap',rm.id)}
function exportRm(rid){const rm=RM_(rid);const code=['gantt',`  title ${rm.n}`,'  dateFormat YYYY-MM-DD',...rm.phases.flatMap(p=>[`  section ${p.n}`,...rm.items.filter(i=>i.ph===p.id).sort((a,b)=>a.s-b.s).map(i=>{const tags=[i.d===0?'milestone':'',i.pct>=100?'done':''].filter(Boolean);return `  ${i.n.padEnd(26)}:${tags.length?tags.join(', ')+', ':''}${i.id}, ${iso(i.s)}, ${i.d}d`})])].join('\n');navigator.clipboard?.writeText(code).catch(()=>{});toast('Copied as Mermaid gantt code')}
function scrollToday(){requestAnimationFrame(()=>{const g=document.getElementById('gx');if(!g)return;const rm=RM_(S.route.id);const A=rmSpan(rm)[0]-3;g.scrollLeft=Math.max(0,(0-A)*PPD[S.rm.zoom]-(g.clientWidth-(S._LW||380))*.3)})}
function barDown(e,rid,iid){if(e.button)return;e.preventDefault();const rm=RM_(rid),it=item(rm,iid),el=e.currentTarget;const rz=!!e.target.dataset.rz;const ppd=PPD[S.rm.zoom];const x0=e.clientX,s0=it.s,d0=it.d,l0=parseFloat(el.style.left),w0=parseFloat(el.style.width);let moved=false;el.setPointerCapture(e.pointerId);el.focus({preventScroll:true});
 const mv=ev=>{const dd=Math.round((ev.clientX-x0)/ppd);if(dd)moved=true;if(rz)el.style.width=Math.max(ppd,w0+dd*ppd)+'px';else el.style.left=(l0+dd*ppd)+'px';el.style.cursor='grabbing'};
 const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);const dd=Math.round((ev.clientX-x0)/ppd);if(rz)it.d=Math.max(1,d0+dd);else it.s=s0+dd;S.rm.sel=iid;if(moved){rm.canvas=null;toast(rz?`${it.n}: ${it.d} days`:`${it.n} now starts ${sd(it.s)}`)}render()};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}
function barKey(e,rid,iid){const rm=RM_(rid),it=item(rm,iid);if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();const d=e.key==='ArrowRight'?1:-1;if(e.shiftKey)it.d=Math.max(1,it.d+d);else it.s+=d;S.rm.sel=iid;rm.canvas=null;render();document.querySelector('.gbar.sel')?.focus({preventScroll:true})}else if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();S.rm.sel=iid;render();document.querySelector('.gbar.sel')?.focus({preventScroll:true})}}
// canvas
const curRm=()=>RM_(S.route.id);
const n0=id=>curRm().canvas.nodes.find(x=>x.id===id);
function drawEdges(){const rm=curRm();if(!rm.canvas)return;const slot=document.getElementById('edgeslot')||document.getElementById('cvsvg');if(slot)slot.outerHTML=edgesSVG(rm)}
function cvApply(){const C=curRm().canvas;const w=document.getElementById('world'),cv=document.getElementById('cv');if(!w)return;w.style.transform=`translate(${C.pan.x}px,${C.pan.y}px) scale(${C.z})`;cv.style.backgroundSize=`${22*C.z}px ${22*C.z}px`;cv.style.backgroundPosition=`${C.pan.x}px ${C.pan.y}px`;const z=cv.querySelector('.cvzoom span');if(z)z.textContent=Math.round(C.z*100)+'%'}
function cvPoint(e){const r=document.getElementById('cv').getBoundingClientRect();const C=curRm().canvas;return {x:(e.clientX-r.left-C.pan.x)/C.z,y:(e.clientY-r.top-C.pan.y)/C.z}}
function cvAdd(kind,p){const rm=curRm(),C=rm.canvas;let n;
 if(kind==='sticky')n={k:'sticky',w:200,h:110,text:'New note'};else if(kind==='text')n={k:'text',w:240,h:30,text:'Heading'};else if(kind==='card')n={k:'card',w:220,h:44,text:'New card'};else if(kind==='frame')n={k:'frame',w:320,h:220,text:'New frame'};else{const g=G(rm.goal)||GOALS[0];n={k:'goal',w:240,h:70,ref:g.id}}
 Object.assign(n,{id:uid('c'),x:Math.round(p.x-n.w/2),y:Math.round(p.y-20)});if(kind==='frame')C.nodes.unshift(n);else C.nodes.push(n);S.rm.cvSel=n.id;S.rm.tool='select';render();if(kind!=='goal')cvEdit(n.id)}
function cvEdit(id){const el=document.querySelector(`[data-n="${id}"] [data-edit]`);if(!el)return;el.contentEditable='true';el.focus();document.getSelection().selectAllChildren(el);
 el.onblur=()=>{const n=n0(id);if(n)n.text=el.innerText.trim()||n.text;el.contentEditable='false';render()};
 el.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Escape'||(ev.key==='Enter'&&!ev.shiftKey&&n0(id).k!=='sticky')){ev.preventDefault();el.blur()}}}
function cvDown(e){if(e.target.closest('.cvbar,.cvzoom')||e.button>1||e.target.isContentEditable)return;const C=curRm().canvas;const cv=document.getElementById('cv');cv.focus({preventScroll:true});const nodeEl=e.target.closest('[data-n]');const tool=S.rm.tool;
 if(['sticky','text','card','goal','frame'].includes(tool)){cvAdd(tool,cvPoint(e));return}
 if(nodeEl&&tool==='connect'){const id=nodeEl.dataset.n;if(!S.rm.edgeFrom){S.rm.edgeFrom=id;render()}else if(S.rm.edgeFrom!==id){C.edges.push([S.rm.edgeFrom,id]);S.rm.edgeFrom=null;S.rm.tool='select';toast('Connected');render()}return}
 if(nodeEl&&tool==='select'&&!S._space){const id=nodeEl.dataset.n;const n=n0(id);S.rm.cvSel=id;document.querySelectorAll('.cn.sel').forEach(x=>x.classList.remove('sel'));nodeEl.classList.add('sel');
  const kids=n.k==='frame'?C.nodes.filter(m=>m!==n&&(m.parent===id||(m.k!=='frame'&&m.x>=n.x&&m.y>=n.y&&m.x+m.w<=n.x+n.w&&m.y<=n.y+n.h))):[];const start=[{n,x:n.x,y:n.y},...kids.map(k=>({n:k,x:k.x,y:k.y}))];const x0=e.clientX,y0=e.clientY;
  const mv=ev=>{const dx=(ev.clientX-x0)/C.z,dy=(ev.clientY-y0)/C.z;start.forEach(s=>{s.n.x=Math.round(s.x+dx);s.n.y=Math.round(s.y+dy);const el=document.querySelector(`[data-n="${s.n.id}"]`);if(el){el.style.left=s.n.x+'px';el.style.top=s.n.y+'px'}});drawEdges()};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up);return}
 if(!nodeEl&&S.rm.cvSel){S.rm.cvSel=null;document.querySelectorAll('.cn.sel').forEach(x=>x.classList.remove('sel'))}
 const x0=e.clientX,y0=e.clientY,p0={...C.pan};cv.classList.add('panning');
 const mv=ev=>{C.pan.x=p0.x+ev.clientX-x0;C.pan.y=p0.y+ev.clientY-y0;cvApply()};const up=()=>{cv.classList.remove('panning');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)}
function cvDbl(e){if(e.target.closest('.cvbar,.cvzoom'))return;const nodeEl=e.target.closest('[data-n]');if(nodeEl){const n=n0(nodeEl.dataset.n);if(n.k==='step'){S.rm.sel=n.ref;S.rm.view='gantt';S._needToday=false;render();return}if(n.k!=='goal')cvEdit(n.id);return}cvAdd('sticky',cvPoint(e))}
function cvWheel(e){e.preventDefault();const C=curRm().canvas;if(e.ctrlKey||e.metaKey){const r=document.getElementById('cv').getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const z=Math.min(2.5,Math.max(.2,C.z*(e.deltaY<0?1.1:1/1.1)));C.pan.x=mx-(mx-C.pan.x)*z/C.z;C.pan.y=my-(my-C.pan.y)*z/C.z;C.z=z}else{C.pan.x-=e.deltaX;C.pan.y-=e.deltaY}cvApply()}
function cvZoom(d){const C=curRm().canvas;const cv=document.getElementById('cv');const mx=cv.clientWidth/2,my=cv.clientHeight/2;const z=Math.min(2.5,Math.max(.2,C.z*(d>0?1.2:1/1.2)));C.pan.x=mx-(mx-C.pan.x)*z/C.z;C.pan.y=my-(my-C.pan.y)*z/C.z;C.z=z;cvApply()}
function cvFit(){const C=curRm().canvas;const cv=document.getElementById('cv');const x0=Math.min(...C.nodes.map(n=>n.x)),y0=Math.min(...C.nodes.map(n=>n.y)),x1=Math.max(...C.nodes.map(n=>n.x+n.w)),y1=Math.max(...C.nodes.map(n=>n.y+(n.h||60)));const z=Math.max(.2,Math.min(1.4,(cv.clientWidth-80)/(x1-x0),(cv.clientHeight-150)/(y1-y0)));C.z=z;C.pan.x=(cv.clientWidth-(x1-x0)*z)/2-x0*z;C.pan.y=70+(cv.clientHeight-110-(y1-y0)*z)/2-y0*z;cvApply()}
function cvKey(e){if(e.target.isContentEditable)return;const C=curRm().canvas;const k=e.key.toLowerCase();const sel=S.rm.cvSel&&n0(S.rm.cvSel);
 const tools={v:'select',h:'hand',n:'sticky',t:'text',k:'card',g:'goal',f:'frame',c:'connect'};
 if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();e.stopPropagation();C.nodes=C.nodes.filter(n=>n.id!==sel.id);C.edges=C.edges.filter(([a,b])=>a!==sel.id&&b!==sel.id);S.rm.cvSel=null;toast('Removed from canvas');render();document.getElementById('cv')?.focus();return}
 if(e.key.startsWith('Arrow')&&sel){e.preventDefault();e.stopPropagation();const s=e.shiftKey?40:10;if(k==='arrowleft')sel.x-=s;if(k==='arrowright')sel.x+=s;if(k==='arrowup')sel.y-=s;if(k==='arrowdown')sel.y+=s;render();document.getElementById('cv')?.focus();return}
 if(e.key==='Enter'&&sel&&sel.k!=='step'&&sel.k!=='goal'){e.preventDefault();e.stopPropagation();cvEdit(sel.id);return}
 if(e.key===' '){e.preventDefault();e.stopPropagation();S._space=true;document.getElementById('cv').classList.add('hand');return}
 if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&tools[k]){e.preventDefault();e.stopPropagation();S.rm.tool=tools[k];S.rm.edgeFrom=null;render();document.getElementById('cv')?.focus()}}
addEventListener('keyup',e=>{if(e.key===' '&&S._space){S._space=false;document.getElementById('cv')?.classList.remove('hand')}});
// palette keys
function openPal(q=''){S.pal={q,scope:'all',i:0};S.focus='palin';render()}
function palKey(e){const n=S._palFlat.length;const scopes=['all','tasks','goals','places','pages','routines','actions'];
 if(e.key==='ArrowDown'){e.preventDefault();S.pal.i=(S.pal.i+1)%Math.max(n,1);S.focus='palin';render();document.getElementById('res'+S.pal.i)?.scrollIntoView({block:'nearest'})}
 else if(e.key==='ArrowUp'){e.preventDefault();S.pal.i=(S.pal.i-1+n)%Math.max(n,1);S.focus='palin';render();document.getElementById('res'+S.pal.i)?.scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();const it=S._palFlat[S.pal.i];if(it){new Function(it.run)();render()}}
 else if(e.key==='Tab'){e.preventDefault();S.pal.scope=scopes[(scopes.indexOf(S.pal.scope)+(e.shiftKey?6:1))%7];S.pal.i=0;S.focus='palin';render()}
 else if(e.key==='Escape'){S.pal=null;render()}}
// keyboard selection (Todoist-style)
function visibleTids(){const seen=new Set();return [...document.querySelectorAll('#view [data-tid]')].map(e=>+e.dataset.tid).filter(id=>!seen.has(id)&&seen.add(id))}
function markSel(){document.querySelectorAll('.kb').forEach(e=>e.classList.remove('kb'));if(S.sel==null)return;const el=document.querySelector(`#view [data-tid="${S.sel}"]`);if(el)el.classList.add('kb')}
function moveSel(d){const ids=visibleTids();if(!ids.length)return;let i=ids.indexOf(S.sel);i=i<0?(d>0?0:ids.length-1):Math.min(ids.length-1,Math.max(0,i+d));S.sel=ids[i];if(S.taskOpen){S.taskOpen=S.sel;render()}else markSel();document.querySelector(`#view [data-tid="${S.sel}"]`)?.scrollIntoView({block:'nearest'})}
addEventListener('keydown',e=>{const typing=e.target.closest('input,textarea,select,[contenteditable=true]');const k=e.key;
 if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();S.pal?(S.pal=null,render()):openPal();return}
 if(k==='Escape'){if(S.help||S.pal||S.qa||S.pop||S.drawer||S.taskOpen||S.chord||S.home.gallery){S.help=false;S.pal=null;S.qa=null;S.pop=null;S.drawer=false;S.taskOpen=null;S.chord=null;S.home.gallery=false;render()}else if(S.sel!=null){S.sel=null;markSel()}return}
 if(typing||S.pal||S.qa||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target.closest('#cv')&&!['q','Q','?','/','['].includes(k))return;
 if(S.chord==='g'){S.chord=null;const m={h:'home',i:'inbox',t:'today',u:'upcoming',o:'goals',m:'roadmaps',r:'routines'}[k.toLowerCase()];const ar=Object.keys(AREAS)[+k-1];e.preventDefault();if(m)go(m);else if(ar)go('area',ar);else render();return}
 if(S.help&&k!=='?')return;
 const t=S.sel!=null?TASKS.find(x=>x.id===S.sel):null;
 switch(k){
  case 'q':case 'Q':e.preventDefault();S.qa={text:''};S.focus='qain';render();break;
  case '/':e.preventDefault();openPal();break;
  case '?':e.preventDefault();S.help=!S.help;render();break;
  case '[':if(S.device==='desk'){S.sideHidden=!S.sideHidden;render()}break;
  case 'g':S.chord='g';render();setTimeout(()=>{if(S.chord){S.chord=null;render()}},2000);break;
  case 'j':case 'ArrowDown':if(e.target.closest('.gbar,.card'))return;e.preventDefault();moveSel(1);break;
  case 'k':case 'ArrowUp':if(e.target.closest('.gbar,.card'))return;e.preventDefault();moveSel(-1);break;
  case 'Enter':if(t&&!e.target.closest('button,.gbar')){e.preventDefault();openTask(t.id)}break;
  case 'e':case 'x':if(t){e.preventDefault();toggleTask(t.id)}break;
  case '1':case '2':case '3':case '4':if(t){t.p=+k;toast(`Priority ${k}`);render()}break;
  case 't':if(t){t.due=0;toast(`“${t.t}” due today`);render()}break;
  case 'T':if(t){t.due=null;toast('Date removed');render()}break;
  case 'y':if(t){t.due=1;toast(`“${t.t}” due tomorrow`);render()}break;
  case 'Delete':case '#':if(t){const i=TASKS.indexOf(t);TASKS.splice(i,1);S._del=[i,t];S.sel=null;S.taskOpen=null;toast(`Deleted “${t.t}”`,'TASKS.splice(S._del[0],0,S._del[1])');render()}break;
  case 'v':if(curDef()){const V=curV();const ls=LAYOUTS.map(l=>l[0]);V.layout=ls[(ls.indexOf(V.layout)+1)%ls.length];toast(`${LAYOUTS.find(l=>l[0]===V.layout)[2]} layout`);render()}break;
  case 'f':if(curDef()){S.pop=S.pop==='filter'?null:'filter';render()}break;}});
addEventListener('click',e=>{if(S.pop&&!e.target.closest('[data-pop]')){S.pop=null;render()}});
if(P.get('layout')){const d=curDef();if(d)cvState(d).layout=P.get('layout')}
if(P.get('sel'))S.sel=+P.get('sel');
render();if(S.route.s==='roadmap')scrollToday();
</script></body></html>
