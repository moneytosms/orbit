<!doctype html>
<!-- PROTOTYPE, throwaway (#26 Screen layouts and visual direction), round 2.
     Base: design A sidebar + design C dashboard widgets. Warm-Notion world: calm structure, paper neutrals,
     one terracotta accent, muted per-Area hues. All state in memory; nothing persists. ?device=desk|phone&theme=light|dark&s=<screen> -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
 --bg:#fbfaf8;--side:#f5f3ef;--surface:#ffffff;--sunk:#f2efea;--hover:rgba(60,45,25,.055);--press:rgba(60,45,25,.09);
 --border:#ebe7e0;--border-strong:#dcd5ca;--text:#2a2723;--muted:#6b665e;--icon:#8a847a;
 --accent:#c2552f;--accent-ink:#fff;--accent-soft:#f8ebe4;--accent-line:#e9b9a5;
 --ok:#3d7a4d;--ok-soft:#e5f0e7;--warn:#9a5d08;--warn-soft:#f7ecd8;--danger:#bb3a2a;--danger-soft:#f9e6e2;
 --career:#b37419;--college:#3b6cb0;--learning:#468253;--home:#ad4f66;
 --sh1:0 1px 2px rgba(45,32,18,.06),0 1px 1px rgba(45,32,18,.03);
 --sh2:0 14px 36px rgba(45,32,18,.14),0 3px 8px rgba(45,32,18,.07);
 --r:10px;--focus:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
 color-scheme:light}
[data-theme=dark]{
 --bg:#1b1a18;--side:#211f1d;--surface:#252321;--sunk:#1e1d1b;--hover:rgba(255,240,220,.06);--press:rgba(255,240,220,.1);
 --border:#33302c;--border-strong:#45413b;--text:#ede8e0;--muted:#a8a197;--icon:#8f897f;
 --accent:#e2835e;--accent-ink:#1b1a18;--accent-soft:#3a281f;--accent-line:#7a4631;
 --ok:#7fc08c;--ok-soft:#1f2f23;--warn:#e2ab5a;--warn-soft:#33291a;--danger:#ef8070;--danger-soft:#3a2320;
 --career:#dba24c;--college:#79a2e0;--learning:#82bb8d;--home:#dc8ba0;
 --sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 16px 40px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft);color:var(--text)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.lucide{width:16px;height:16px;stroke-width:1.8;flex:none}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;border:3px solid transparent;background-clip:padding-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* stage / frame */
.stage{height:100vh;display:flex;align-items:center;justify-content:center}
.frame{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.phone .stage{background:#d9d4cb}[data-theme=dark] .phone .stage,.phone[data-theme=dark] .stage{background:#0d0c0b}
.phone .frame{width:390px;height:800px;border-radius:40px;border:10px solid #0d0c0b;box-shadow:0 30px 80px rgba(0,0,0,.35)}

/* app shell */
.app{display:grid;grid-template-columns:256px 1fr;height:100%}
.side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-scroll{overflow:auto;padding:10px 8px 12px;flex:1}
.brand{display:flex;align-items:center;gap:9px;padding:12px 14px 6px;font-weight:600;font-size:15px}
.brand svg{width:22px;height:22px}
.side-actions{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 8px 4px}
.sbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);box-shadow:var(--sh1)}
.sbtn:hover{border-color:var(--border-strong);color:var(--text)}
.kbd{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 5px;background:var(--sunk)}
.newbtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--sh1)}
.newbtn:hover{filter:brightness(1.06)}
.nv{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border-radius:7px;color:var(--text);position:relative}
.nv .lucide{color:var(--icon)}
.nv:hover{background:var(--hover)}.nv.on{background:var(--press);font-weight:600}.nv.on .lucide{color:var(--accent)}
.nv .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.nv.sub{padding-left:30px;height:30px}
.nv .tw{width:16px;display:inline-flex;justify-content:center;margin-left:-4px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sec-h button{color:var(--icon);border-radius:5px;padding:2px}.sec-h button:hover{background:var(--hover);color:var(--text)}
.adot{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 15%,transparent);flex:none}
.adot .lucide{color:var(--c)!important;width:14px;height:14px}
.side-foot{border-top:1px solid var(--border);padding:8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:48px;display:flex;align-items:center;gap:6px;padding:0 16px 0 20px;flex:none}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;color:var(--muted)}
.crumbs button{padding:3px 7px;border-radius:6px;white-space:nowrap}.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:500}
.crumbs .lucide{width:14px;height:14px;color:var(--icon)}
.top-actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.view{flex:1;overflow:auto;min-height:0}
.wrap{max-width:1160px;margin:0 auto;padding:8px 40px 64px}
.wrap.narrow{max-width:860px}
.ph{display:flex;align-items:flex-end;gap:16px;margin:10px 0 20px;flex-wrap:wrap}
.ph h1{font-size:28px;line-height:1.2;letter-spacing:-.015em;margin:0;font-weight:700}
.ph .lead{color:var(--muted);margin-top:4px}
.ph .grow{flex:1;min-width:220px}
.title-ic{display:flex;align-items:center;gap:12px}
.title-ic .adot{width:36px;height:36px;border-radius:10px}.title-ic .adot .lucide{width:20px;height:20px}

/* buttons, chips, controls */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:500;box-shadow:var(--sh1);white-space:nowrap}
.btn:hover{border-color:var(--border-strong);background:color-mix(in srgb,var(--surface) 90%,var(--text))}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted)}.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.06)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.ibtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--icon)}
.ibtn:hover{background:var(--hover);color:var(--text)}.ibtn.sm{width:26px;height:26px}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--sunk);border:1px solid var(--border);gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button:hover{color:var(--text)}.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh1)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12.5px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip .lucide{width:13px;height:13px}
.chip.danger{background:var(--danger-soft);color:var(--danger)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.area{background:none;border-color:var(--border);color:var(--text)}
.chip.area i.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.x{padding-right:3px}.chip.x button{display:inline-flex;border-radius:4px;color:inherit;opacity:.7}.chip.x button:hover{opacity:1;background:var(--hover)}
.field{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0}
.field:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.field input{border:0;outline:0;background:none;flex:1;min-width:0}
.field .lucide{color:var(--icon)}
input::placeholder{color:var(--muted)}
select.sel{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 8px}
.switch{width:34px;height:20px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh1);transition:transform .15s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(14px)}

/* task row */
.trow{display:flex;align-items:center;gap:11px;min-height:42px;padding:6px 8px;border-radius:8px;position:relative}
.trow:hover{background:var(--hover)}
.trow+.trow::before{content:"";position:absolute;left:38px;right:8px;top:0;border-top:1px solid var(--border)}
.trow:hover::before,.trow:hover+.trow::before{border-color:transparent}
.ck{width:18px;height:18px;border-radius:50%;border:1.75px solid var(--pc,var(--border-strong));flex:none;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pc,transparent) 8%,transparent)}
.ck:hover{background:color-mix(in srgb,var(--pc,var(--muted)) 20%,transparent)}
.ck .lucide{width:12px;height:12px;stroke-width:3;opacity:0;color:var(--accent-ink)}
.ck:hover .lucide{opacity:.6;color:var(--pc,var(--muted))}
.ck.on{background:var(--ok);border-color:var(--ok)}.ck.on .lucide{opacity:1;color:#fff}
.p1{--pc:var(--danger)}.p2{--pc:var(--warn)}.p3{--pc:var(--college)}
.tt{flex:1;min-width:0}
.tt .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.done .name{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.why{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:1px}
.why .lucide{width:13px;height:13px}
.group-h{display:flex;align-items:center;gap:8px;margin:22px 0 4px;padding:0 8px;font-weight:600}
.group-h .n{color:var(--muted);font-weight:400;font-size:13px}
.inline-add{display:flex;align-items:center;gap:10px;height:38px;padding:0 9px;border-radius:8px;color:var(--muted);width:100%}
.inline-add:hover{background:var(--hover);color:var(--accent)}
.inline-add .plus{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}

/* widgets / dashboard */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.w{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh1);display:flex;flex-direction:column;min-width:0;transition:box-shadow .15s,border-color .15s}
.w.s4{grid-column:span 4}.w.s6{grid-column:span 6}.w.s8{grid-column:span 8}.w.s12{grid-column:span 12}
.wh{display:flex;align-items:center;gap:9px;padding:13px 16px 6px}
.wh h2{font-size:14.5px;font-weight:600;margin:0;flex:1}
.wh .wi{color:var(--accent);display:inline-flex}
.wb{padding:4px 8px 10px}
.wb.pad{padding:6px 16px 16px}
.wf{border-top:1px solid var(--border);padding:6px 8px}
.w.editing{border-style:dashed;border-color:var(--border-strong);cursor:grab}
.w.dragging{opacity:.4}.w.dropto{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wedit{display:flex;gap:2px;align-items:center}
.wedit .size{font-size:12px;font-weight:600;color:var(--muted);height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--border)}
.tray{grid-column:span 12;border:1.5px dashed var(--border-strong);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.composer{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh1);padding:10px 10px 10px 14px;margin-bottom:18px}
.composer:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft),var(--sh1)}
.composer .row{display:flex;align-items:center;gap:10px}
.composer input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0;height:32px}
.composer .parsed{display:flex;gap:6px;flex-wrap:wrap;padding-left:28px}
.composer .plusic{color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.hint code{font-family:inherit;background:var(--sunk);border-radius:4px;padding:0 4px;color:var(--text)}
/* routines quick tick */
.rtick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);min-height:52px;transition:background .15s,border-color .15s}
.tick:hover{border-color:var(--border-strong)}
.tick .bub{width:26px;height:26px;border-radius:50%;border:1.75px dashed var(--border-strong);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--icon)}
.tick .bub .lucide{width:14px;height:14px}
.tick.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tick.done .bub{background:var(--ok);border:0;color:#fff}
.tick.skip{background:var(--sunk)}.tick.skip .bub{border-style:solid;color:var(--muted)}
.tick .nm{font-weight:500;line-height:1.25}.tick .st{font-size:12.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.tick .st .lucide{width:12px;height:12px;color:var(--warn)}
/* upcoming */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 8px 8px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;border-radius:9px;border:1px solid transparent}
.day:hover{background:var(--hover)}.day.on{background:var(--accent-soft);border-color:var(--accent-line)}
.day .dn{font-size:12px;color:var(--muted)}.day .dd{font-size:16px;font-weight:600}.day.on .dd,.day.on .dn{color:var(--accent)}
.day .load{display:flex;gap:2px;height:4px}.day .load i{width:5px;border-radius:2px;background:var(--border-strong)}.day .load i.hot{background:var(--accent)}
.daygroup{font-size:13px;font-weight:600;color:var(--muted);padding:10px 8px 2px;display:flex;gap:6px;align-items:center}
/* goals */
.goal{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 8px;border-radius:9px;width:100%}
.goal:hover{background:var(--hover)}
.goal .gname{font-weight:500}.goal .gnum{color:var(--muted);font-size:13px}
.pace{grid-column:2/4;position:relative;height:8px;border-radius:9px;background:var(--sunk);overflow:visible}
.pace i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--c,var(--accent))}
.pace b{position:absolute;top:-3px;width:2px;height:14px;background:var(--text);border-radius:2px;opacity:.55}
/* roadmap mini */
.mini-rm{display:flex;gap:3px;margin:6px 0 10px}
.mini-rm div{height:28px;border-radius:7px;display:flex;align-items:center;padding:0 9px;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;gap:5px}
.mini-rm .d{background:var(--ok-soft);color:var(--ok)}.mini-rm .a{background:var(--accent-soft);color:var(--accent);outline:1.5px solid var(--accent-line)}
.mini-rm .l{background:var(--sunk);color:var(--muted)}
.mini-rm .lucide{width:13px;height:13px}
/* toolbar + popovers */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:relative}
.toolbar .field{width:240px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh2);padding:8px;min-width:260px;top:calc(100% + 6px)}
.pop h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:8px 8px 6px}
.pop .opts{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px 6px}
.opt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border);font-size:13px}
.opt:hover{border-color:var(--border-strong)}.opt.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;width:100%}
.prow:hover{background:var(--hover)}.prow .grow{flex:1}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 16px;align-items:flex-start;scroll-snap-type:x mandatory}
.colm{flex:0 0 272px;background:var(--sunk);border-radius:12px;padding:8px;scroll-snap-align:start;border:1px solid transparent}
.colm.drop{border-color:var(--accent-line);background:var(--accent-soft)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-weight:600}
.colh .n{color:var(--muted);font-weight:400}
.colh .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--icon))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:7px;box-shadow:var(--sh1);cursor:grab;display:block;width:100%}
.card:hover{border-color:var(--border-strong)}.card.dragging{opacity:.4}
.card .ct{display:flex;gap:9px;align-items:flex-start}.card .ct .ck{margin-top:1px}
.card .cm{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-left:27px}
.card.done .ctitle{text-decoration:line-through;color:var(--muted)}
.subbar{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.subbar span{width:36px;height:4px;border-radius:4px;background:var(--border);position:relative;overflow:hidden}.subbar span i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.coladd{display:flex;align-items:center;gap:7px;color:var(--muted);height:34px;padding:0 8px;border-radius:8px;width:100%}.coladd:hover{background:var(--hover);color:var(--text)}
.colinput{width:100%;border:1px solid var(--accent-line);border-radius:9px;padding:9px 10px;background:var(--surface);outline:0;box-shadow:0 0 0 3px var(--accent-soft);margin-bottom:6px}
/* project timeline */
.gantt{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow-x:auto}
.gantt .g{display:grid;grid-template-columns:200px 1fr;min-width:900px}
.gantt .gh{position:sticky;top:0}
.gantt .lbl{padding:0 12px;height:40px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .trk{position:relative;height:40px;border-bottom:1px solid var(--border);background-image:linear-gradient(to right,var(--border) 1px,transparent 1px);background-size:calc(100%/28) 100%}
.gantt .bar{position:absolute;top:8px;height:24px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);font-size:12.5px;padding:0 8px;display:flex;align-items:center;white-space:nowrap}
.gantt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2}

// ---------- quick-add parsing (shared by composer, quick-add dialog, phone sheet) ----------
const WDS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseQuick(text){
 const out={title:[],due:null,p:4,lb:[],proj:null,area:null,tokens:[]};
 text.split(/\s+/).filter(Boolean).forEach(w=>{const lw=w.toLowerCase();
  if(lw==='today'){out.due=0;out.tokens.push(['calendar','Today'])}
  else if(lw==='tomorrow'||lw==='tmr'){out.due=1;out.tokens.push(['calendar','Tomorrow'])}
  else if(WDS.some(d=>d.startsWith(lw)&&lw.length>=3)){const wd=WDS.findIndex(d=>d.startsWith(lw));let o=(wd-BASE.getDay()+7)%7||7;out.due=o;out.tokens.push(['calendar',dayName(o)])}
  else if(/^p[1-4]$/.test(lw)){out.p=+lw[1];out.tokens.push(['flag','Priority '+lw[1]])}
  else if(/^#\w+/.test(w)){out.lb.push(w.slice(1));out.tokens.push(['hash',w.slice(1)])}
  else if(/^@\w+/.test(w)){const k=lw.slice(1);const pj=Object.entries(PROJECTS).find(([id,p])=>id.startsWith(k)||p.n.toLowerCase().startsWith(k));const ar=Object.entries(AREAS).find(([id])=>id.startsWith(k));if(pj){out.proj=pj[0];out.area=pj[1].area;out.tokens.push(['folder',pj[1].n])}else if(ar){out.area=ar[0];out.tokens.push(['folder',ar[1].n])}else out.title.push(w)}
  else out.title.push(w)});
 out.title=out.title.join(' ');return out}
function addFromText(text,fallback={}){
 const q=parseQuick(text);if(!q.title)return false;
 const proj=q.proj||fallback.proj||(q.area?null:'inbox');
 const t={id:nid++,t:q.title,p:q.p,proj,sec:fallback.sec||(proj?PROJECTS[proj].sections[0]:''),due:q.due??fallback.due??null,lb:q.lb,area:q.area||fallback.area||(proj?PROJECTS[proj].area:null),done:false};
 TASKS.push(t);toast(`Added “${t.t}” to ${proj?PROJECTS[proj].n:AREAS[t.area].n}`);return true}
const parsedChips=text=>{const q=parseQuick(text);return q.tokens.length?q.tokens.map(([i,l])=>chip(esc(l),'acc',i)).join(''):`<span class="hint">Type naturally: <code>fri</code> <code>p1</code> <code>#label</code> <code>@project</code></span>`};

function rmLanes(){const ppd=PPD;const lanes=[];const out={};RM.items.slice().sort((a,b)=>a.s-b.s).forEach(it=>{const end=it.ms?it.s+10:Math.max(it.e,it.s+110/ppd);let l=lanes.findIndex(e=>e<it.s-1);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=end;out[it.id]=l});return [out,lanes.length]}

function svgIcon(kind,x,y,c){if(kind==='done')return `<path d="M${x} ${y+5}l3.5 3.5L${x+10} ${y+1}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
 if(kind==='locked')return `<g fill="none" stroke="var(--muted)" stroke-width="1.7"><rect x="${x}" y="${y+4}" width="10" height="7.5" rx="1.5"/><path d="M${x+2.2} ${y+4}v-2a2.8 2.8 0 0 1 5.6 0v2"/></g>`;

 return `<circle cx="${x+5}" cy="${y+6}" r="4.2" fill="none" stroke="var(--icon)" stroke-width="1.6"/>`}
function canvasSVG(){const z=S.road.zoom,ppd=PPD*z,X=d=>(d-RM.start)*ppd;const [lane,nl]=rmLanes();const top=92,lh=56;const W=X(RM.end),H=top+nl*lh+40;const fil=S.road.sketch?'filter="url(#rough)"':'';
 let s=`<svg width="${W}" height="${H}" role="img" aria-label="Roadmap canvas from ${fmt(RM.start,{day:'numeric',month:'short'})} to ${fmt(RM.end,{day:'numeric',month:'short'})}"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--icon)"/></marker><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--sunk)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--border)" stroke-width="3"/></pattern></defs>`;
 // phase bands
 RM.phases.forEach((p,i)=>{const st=i===0?'done':i===1?'active':'locked';const x=X(p.s),w=X(p.e)-x;
  s+=`<rect x="${x}" y="0" width="${w}" height="${H}" fill="${st==='locked'?'url(#hatch)':i%2?'var(--surface)':'transparent'}" opacity="${st==='locked'?.55:.7}"/>`;
  s+=`<g ${fil}><rect x="${x+8}" y="44" width="${Math.min(w-16,260)}" height="32" rx="8" fill="var(--surface)" stroke="${STC[st][1]}" stroke-width="1.3"/></g>${svgIcon(st,x+18,53,STC[st][1])}<text x="${x+36}" y="65" font-size="13.5" font-weight="600">${p.n}</text><text x="${x+36+p.n.length*7.6+10}" y="65" font-size="12.5" style="fill:var(--muted)">${fmt(p.s,{day:'numeric',month:'short'})} – ${fmt(p.e,{day:'numeric',month:'short'})}</text>`;
  if(p.gate){s+=`<line x1="${x}" y1="36" x2="${x}" y2="${H}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5" opacity=".7"/><g transform="translate(${x-46},${H-30})"><rect width="92" height="22" rx="11" fill="var(--surface)" stroke="var(--accent-line)"/><text x="46" y="15" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--accent)">Gate ${fmt(p.s,{day:'numeric',month:'short'})}</text></g>`}});
 // month axis
 s+=`<rect x="0" y="0" width="${W}" height="32" fill="var(--surface)"/><line x1="0" y1="32" x2="${W}" y2="32" stroke="var(--border)"/>`;
 for(let d=RM.start;d<=RM.end;d++){const D=dt(d);if(D.getDate()===1)s+=`<text x="${X(d)+6}" y="21" font-size="12.5" font-weight="600">${fmt(d,{month:'long'})}</text><line x1="${X(d)}" y1="0" x2="${X(d)}" y2="32" stroke="var(--border-strong)"/>`;else if(D.getDay()===1&&z>=.8)s+=`<text x="${X(d)+3}" y="21" font-size="11.5" style="fill:var(--muted)">${D.getDate()}</text>`}
 // deps
 RM.items.forEach(it=>(it.dep||[]).forEach(dp=>{const a=RM.items.find(i=>i.id===dp);const ax=a.ms?X(a.s)+9:X(Math.max(a.e,a.s+110/PPD)) ,ay=top+lane[a.id]*lh+17,bx=(it.ms?X(it.s)-10:X(it.s))-2,by=top+lane[it.id]*lh+17;const mx=Math.max(ax+24,(ax+bx)/2);
  s+=`<path ${fil} d="M${ax} ${ay}C${mx} ${ay} ${Math.min(bx-24,mx)} ${by} ${bx} ${by}" fill="none" stroke="var(--icon)" stroke-width="1.4" ${it.st==='locked'?'stroke-dasharray="4 4"':''} marker-end="url(#arr)" opacity=".8"/>`}));
 // items
 RM.items.forEach(it=>{const y=top+lane[it.id]*lh;const [f,c]=STC[it.st];const sel=S.road.sel===it.id;
  if(it.ms){const x=X(it.s);s+=`<g class="node" tabindex="0" role="button" aria-label="Milestone ${it.n}, ${it.st}" onclick="rmSel('${it.id}')" onkeydown="if(event.key==='Enter')rmSel('${it.id}')"><g ${fil}><rect class="box" x="${x-11}" y="${y+6}" width="22" height="22" rx="4" transform="rotate(45 ${x} ${y+17})" fill="${it.st==='locked'?'var(--sunk)':'var(--warn-soft)'}" stroke="${sel?'var(--accent)':'var(--warn)'}" stroke-width="${sel?2.5:1.5}"/></g><text x="${x+20}" y="${y+22}" font-size="13" font-weight="600">${it.n}</text></g>`;return}
  const x=X(it.s),w=Math.max(X(it.e)-x,110*z);
  s+=`<g class="node" tabindex="0" role="button" aria-label="${it.n}, ${it.st}, ${fmt(it.s,{day:'numeric',month:'short'})} to ${fmt(it.e,{day:'numeric',month:'short'})}" onclick="rmSel('${it.id}')" onkeydown="if(event.key==='Enter')rmSel('${it.id}')"><g ${fil}><rect class="box" x="${x}" y="${y}" width="${w}" height="34" rx="9" fill="${f}" stroke="${sel?'var(--accent)':c}" stroke-width="${sel?2.5:1.3}" ${it.st==='locked'?'stroke-dasharray="5 4"':''}/></g>${svgIcon(it.st,x+11,y+11,c)}<text x="${x+29}" y="${y+22}" font-size="13" font-weight="500" ${it.st==='locked'?'style="fill:var(--muted)"':''}>${it.n.length*7.2>w-40?it.n.slice(0,Math.floor((w-44)/7.2))+'…':it.n}</text></g>`});
 // today
 s+=`<line x1="${X(0)}" y1="32" x2="${X(0)}" y2="${H}" stroke="var(--accent)" stroke-width="2"/><g transform="translate(${X(0)-26},8)"><rect width="52" height="18" rx="9" fill="var(--accent)"/><text x="26" y="13" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--accent-ink)">Today</text></g>`;
 return s+'</svg>'}
function graphSVG(){const z=S.road.zoom;const cw=250*z,nw=196*z,nh=46,gap=22,pad=24,top=64;
 const cols=RM.phases.map(p=>RM.items.filter(i=>i.ph===p.id));const pos={};cols.forEach((c,ci)=>c.forEach((it,j)=>pos[it.id]={x:pad+ci*(cw+40)+(cw-nw)/2,y:top+j*(nh+gap)}));
 const H=top+Math.max(...cols.map(c=>c.length))*(nh+gap)+30,W=pad*2+RM.phases.length*(cw+40)-40;const fil=S.road.sketch?'filter="url(#rough)"':'';

 RM.phases.forEach((p,ci)=>{const x=pad+ci*(cw+40);const st=ci===0?'done':ci===1?'active':'locked';
  s+=`<g ${fil}><rect x="${x}" y="12" width="${cw}" height="${H-24}" rx="14" fill="${st==='locked'?'var(--sunk)':'var(--surface)'}" stroke="${st==='active'?'var(--accent-line)':'var(--border)'}" stroke-width="1.3" ${st==='locked'?'stroke-dasharray="6 5"':''}/></g>${svgIcon(st,x+14,26,STC[st][1])}<text x="${x+32}" y="38" font-size="13.5" font-weight="600">${p.n}</text><text x="${x+cw-14}" y="38" text-anchor="end" font-size="12" style="fill:var(--muted)">${p.gate?'Gate '+fmt(p.s,{day:'numeric',month:'short'}):fmt(p.s,{day:'numeric',month:'short'})}</text>`});
 RM.items.forEach(it=>(it.dep||[]).forEach(dp=>{const a=pos[dp],b=pos[it.id];let d;
  if(Math.abs(a.x-b.x)<5)d=`M${a.x+nw/2} ${a.y+nh}L${b.x+nw/2} ${b.y-2}`;else{const ax=a.x+nw,ay=a.y+nh/2,bx=b.x-2,by=b.y+nh/2;d=`M${ax} ${ay}C${ax+40} ${ay} ${bx-40} ${by} ${bx} ${by}`}
  s+=`<path ${fil} d="${d}" fill="none" stroke="var(--icon)" stroke-width="1.5" ${it.st==='locked'?'stroke-dasharray="4 4"':''} marker-end="url(#arr2)"/>`}));
 RM.items.forEach(it=>{const {x,y}=pos[it.id];const [f,c]=STC[it.st];const sel=S.road.sel===it.id;
  s+=`<g class="node" tabindex="0" role="button" aria-label="${it.n}, ${it.st}" onclick="rmSel('${it.id}')" onkeydown="if(event.key==='Enter')rmSel('${it.id}')"><g ${fil}><rect class="box" x="${x}" y="${y}" width="${nw}" height="${nh}" rx="${it.ms?23:10}" fill="${it.ms&&it.st!=='locked'?'var(--warn-soft)':f}" stroke="${sel?'var(--accent)':it.ms&&it.st!=='locked'?'var(--warn)':c}" stroke-width="${sel?2.5:1.3}" ${it.st==='locked'?'stroke-dasharray="5 4"':''}/></g>${svgIcon(it.st,x+12,y+11,c)}<text x="${x+30}" y="${y+20}" font-size="13" font-weight="500">${it.n}</text><text x="${x+30}" y="${y+36}" font-size="11.5" style="fill:var(--muted)">${it.ms?'Milestone · ':''}${fmt(it.s,{day:'numeric',month:'short'})}${it.e?' – '+fmt(it.e,{day:'numeric',month:'short'}):''}</text></g>`});

function best(r){let b=0,c=0;r.hist.forEach(v=>{if(v===null)return;if(v==='d'){c++;b=Math.max(b,c)}else c=0});return Math.max(b,streak(r))}

function routineStats(r){
 const total=r.hist.filter(v=>v==='d').length+(r.today==='d'?1:0);
 const wd=[1,2,3,4,5,6,0].map(d=>{const xs=r.hist.map((v,i)=>[v,dt(i-182).getDay()]).filter(([v,w])=>w===d&&v!==null);return xs.length?Math.round(xs.filter(([v])=>v==='d').length/xs.length*100):0});
 // heatmap: 26 weeks, columns Mon..Sun
 const startOff=-182-((dt(-182).getDay()+6)%7);let cells='';const months=[];

 <section class="panel"><h2>Trend</h2><dl class="kv" style="margin:4px 0 0"><dt>7 days</dt><dd class="num">${rate(r,7)}%</dd><dt>30 days</dt><dd class="num">${rate(r,30)}%</dd><dt>90 days</dt><dd class="num">${rate(r,90)}%</dd><dt>Counts toward</dt><dd>${r.goal?`<button class="lnk" onclick="go('goal','books')">${ic('target')}${r.goal}</button>`:'No goal'}</dd><dt>Reminder</dt><dd>${r.time||'None'}</dd></dl></section></div>`}

const TOK=[[/^p([1-4])$/,m=>['flag','Priority '+m[1],t=>t.p==+m[1]]],[/^#(\w+)$/,m=>['hash','#'+m[1],t=>t.lb?.includes(m[1])]],[/^due:(today|week|overdue)$/,m=>['calendar','Due '+m[1],t=>t.due!=null&&(m[1]==='today'?t.due===0:m[1]==='week'?t.due>=0&&t.due<7:t.due<0)]],[/^is:(done|open)$/,m=>['circle-check',m[1]==='done'?'Completed':'Open',t=>m[1]==='done'?t.done:!t.done]],[/^in:(\w+)$/,m=>['folder','In '+m[1],t=>(t.area||'').startsWith(m[1])||(t.proj||'').startsWith(m[1])]]];
function fuzzy(q,s){if(!q)return [1,s];const L=s.toLowerCase();let i=0,score=0,out='',last=-2;for(let j=0;j<s.length;j++){if(i<q.length&&L[j]===q[i]){score+=j===last+1?3:1;if(j===0||s[j-1]===' ')score+=2;last=j;i++;out+=`<mark>${esc(s[j])}</mark>`}else out+=esc(s[j])}return i===q.length?[score,out]:null}

 const toks=[],rest=[];words.forEach(w=>{const hit=TOK.map(([re,f])=>{const m=w.toLowerCase().match(re);return m&&f(m)}).find(Boolean);hit?toks.push(hit):rest.push(w)});const q=rest.join(' ').toLowerCase();

 <div style="display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px">${parsedChips(v)}</div>
 <div class="pal-foot" style="justify-content:flex-end"><span style="margin-right:auto">Goes to ${(()=>{const q=parseQuick(v);return q.proj?PROJECTS[q.proj].n:q.area?AREAS[q.area].n:'Inbox'})()}</span><button type="button" class="btn ghost sm" onclick="S.qa=null;render()">Cancel</button><button class="btn primary sm" ${parseQuick(v).title?'':'disabled style="opacity:.5"'}>Add task</button></div></form>`;
 return S.device==='phone'?`<div class="sheet-wrap" onclick="if(event.target===this){S.qa=null;render()}"><div class="sheet" role="dialog" aria-modal="true" aria-label="New task"><div class="grab"></div>${inner}</div></div>`:`<div class="scrim" onclick="if(event.target===this){S.qa=null;render()}"><div class="palette qa" role="dialog" aria-modal="true" aria-label="New task">${inner}</div></div>`}

// ---------- shell ----------
const ORBIT_MARK=`<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(-28 12 12)" fill="none" stroke="var(--accent)" stroke-width="1.8"/><circle cx="12" cy="12" r="3.6" fill="var(--text)"/><circle cx="20" cy="7.6" r="1.8" fill="var(--accent)"/></svg>`;
function isOn(s,id){const r=S.route;return r.s===s&&(id==null||r.id===id)}
function sidebar(){const nv=(s,id,icn,label,cnt='')=>`<button class="nv ${isOn(s,id)?'on':''}" onclick="go('${s}'${id?`,'${id}'`:''})" ${isOn(s,id)?'aria-current="page"':''}>${ic(icn)}<span>${label}</span>${cnt!==''?`<span class="cnt num">${cnt}</span>`:''}</button>`;
 const kids=a=>[...Object.entries(PROJECTS).filter(([k,p])=>p.area===a).map(([k,p])=>['project',k,'folder',p.n]),...GOALS.filter(g=>g.area===a).map(g=>['goal',g.id,'target',g.n]),...(a==='learning'?[['roadmap',null,'map',RM.n]]:[]),...PAGES.filter(p=>p.area===a&&p.id==='notes').map(p=>['page',p.id,'file-text',p.n])];
 return `<nav class="side ${S.drawer?'open':''}" aria-label="Main"><div class="brand">${ORBIT_MARK}Orbit</div>
 <div class="side-actions"><button class="sbtn" onclick="openPal()">${ic('search')}Search<span class="kbd">Ctrl K</span></button><button class="newbtn" onclick="S.qa={text:''};S.focus='qain';render()" aria-label="New task (Q)" title="New task  Q">${ic('plus')}</button></div>
 <div class="side-scroll">${nv('home',null,'house','Home')}${nv('inbox',null,'inbox','Inbox',TASKS.filter(t=>t.proj==='inbox'&&!t.done).length)}${nv('upcoming',null,'calendar-days','Upcoming',TASKS.filter(t=>!t.done&&t.due!=null&&t.due<=0).length)}${nv('routines',null,'repeat','Routines',`${ROUTINES.filter(r=>r.today==='d').length}/${ROUTINES.length}`)}
 <div class="sec-h"><span>Areas</span><button aria-label="New Area">${ic('plus')}</button></div>
 ${Object.entries(AREAS).map(([a,A])=>`<button class="nv" onclick="S.open.${a}=!S.open.${a};render()" aria-expanded="${S.open[a]}"><span class="tw">${ic(S.open[a]?'chevron-down':'chevron-right')}</span>${adot(a)}<span>${A.n}</span></button>${S.open[a]?kids(a).map(([s,id,icn,label])=>`<button class="nv sub ${isOn(s,id)?'on':''}" onclick="go('${s}'${id?`,'${id}'`:''})">${ic(icn)}<span>${label}</span></button>`).join(''):''}`).join('')}
 <div class="sec-h"><span>Views</span><button aria-label="New view" onclick="openPal('p1 ')">${ic('plus')}</button></div>${Object.entries(VIEWS).map(([k,v])=>nv('view',k,v.ic,v.n)).join('')}</div>
 <div class="side-foot"><button class="nv">${ic('sparkles')}<span>Profile</span><span class="cnt num">1,240 Stardust</span></button><button class="nv">${ic('settings-2')}<span>Settings</span></button></div></nav>`}
function crumbs(){const r=S.route;const A=a=>`<button onclick="S.open.${a}=true;render()">${AREAS[a].n}</button>`;const sep=ic('chevron-right');
 const map={home:['Home'],inbox:['Inbox'],upcoming:['Upcoming'],routines:['Routines'],view:['Views',VIEWS[r.id]?.n],project:[r.id&&PROJECTS[r.id]?.area?A(PROJECTS[r.id].area):'',PROJECTS[r.id]?.n],goal:[A((GOALS.find(g=>g.id===r.id)||GOALS[0]).area),(GOALS.find(g=>g.id===r.id)||GOALS[0]).n],roadmap:[A('learning'),`<button onclick="go('goal','rust')">Learn Rust</button>`,RM.n],page:[A('career'),`<button onclick="go('goal','intern')">Get internship</button>`,(PAGES.find(p=>p.id===r.id)||PAGES[0]).n]}[r.s].filter(Boolean);
 return map.map((c,i)=>i===map.length-1?`<span class="cur" style="padding:3px 7px">${c}</span>`:(c.startsWith('<')?c:`<span style="padding:3px 7px">${c}</span>`)).join(sep)}
const TITLES={home:'Home',inbox:'Inbox',upcoming:'Upcoming',routines:'Routines',project:()=>PROJECTS[S.route.id].n,view:()=>VIEWS[S.route.id].n,goal:()=>(GOALS.find(g=>g.id===S.route.id)||GOALS[0]).n,roadmap:RM.n,page:()=>(PAGES.find(p=>p.id===S.route.id)||PAGES[0]).n};
function screen(){const s=S.route.s;return s==='home'?screenHome():['project','view','inbox'].includes(s)?screenCollection():s==='upcoming'?screenUpcoming():s==='roadmap'?screenRoadmap():s==='goal'?screenGoal():s==='page'?screenPage():screenRoutines()}
function render(){
 const ph=S.device==='phone';document.documentElement.dataset.theme=S.theme;document.body.className=ph?'phone':'';
 const t=TITLES[S.route.s];
 document.getElementById('frame').innerHTML=`<div class="app">${sidebar()}${ph&&S.drawer?`<div class="drawer-scrim" onclick="S.drawer=false;render()"></div>`:''}
 <div class="main"><header class="topbar">${ph?`<button class="ibtn" onclick="S.drawer=true;render()" aria-label="Open menu">${ic('menu')}</button><span class="ptitle">${typeof t==='function'?t():t}</span>`:`<div class="crumbs">${crumbs()}</div>`}
 <div class="top-actions">${ph?`<button class="ibtn" onclick="openPal()" aria-label="Search">${ic('search')}</button>`:`<button class="btn ghost sm" onclick="S.qa={text:''};S.focus='qain';render()">${ic('plus')}New task<span class="kbd">Q</span></button>`}</div></header>
 <main class="view" id="view">${screen()}</main></div>
 <nav class="tabbar" aria-label="Tabs">${[['home','house','Home'],['upcoming','calendar-days','Upcoming']].map(([s,i,l])=>`<button class="${isOn(s)?'on':''}" onclick="go('${s}')">${ic(i)}${l}</button>`).join('')}<button class="fabb" onclick="S.qa={text:''};S.focus='qain';render()" aria-label="New task"><span>${ic('plus')}</span></button>${[['routines','repeat','Routines']].map(([s,i,l])=>`<button class="${isOn(s)?'on':''}" onclick="go('${s}')">${ic(i)}${l}</button>`).join('')}<button onclick="S.drawer=true;render()">${ic('panel-left')}Browse</button></nav>
 ${S.pal?palette():''}${S.qa?quickAdd():''}${S.toast?`<div class="toast" role="status">${esc(S.toast.msg)}${S.toast.undo?`<button onclick="${S.toast.undo};S.toast=null;render()">Undo</button>`:''}</div>`:''}</div>`;
 window.lucide&&lucide.createIcons();
 if(S.focus){const el=document.getElementById(S.focus);if(el){el.focus();if(el.setSelectionRange&&el.value!=null)try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}S.focus=null}
 document.getElementById('proto').innerHTML=`<span>Prototype</span>${[['desk','Desktop'],['phone','Phone']].map(([k,l])=>`<button class="${S.device===k?'on':''}" onclick="S.device='${k}';S.drawer=false;render()">${l}</button>`).join('')}<button onclick="S.theme=S.theme==='dark'?'light':'dark';render()">${S.theme==='dark'?'Light':'Dark'}</button>`;
 const q=new URLSearchParams({s:S.route.s,device:S.device,theme:S.theme});if(S.route.id)q.set('id',S.route.id);history.replaceState(null,'','?'+q);
 if(S.route.s==='roadmap'&&!S._scrolled){S._scrolled=true;scrollToday()}}

// ---------- actions ----------
function go(s,id){S.route={s,id:id||null};S.drawer=false;S.pop=null;S.proj.adding=null;if(s==='view'){const v=VIEWS[id];S.proj.f=JSON.parse(JSON.stringify(v.f));S.proj.group=v.group}else if(s==='project'){S.proj.f={prio:[],lb:[],due:null};if(S.proj.group==='project')S.proj.group='section'}else if(s==='inbox'){S.proj.f={prio:[],lb:[],due:null};S.proj.group='section'}S._scrolled=false;render();document.getElementById('view')?.scrollTo(0,0)}
function toast(msg,undo){S.toast={msg,undo};clearTimeout(S._tt);S._tt=setTimeout(()=>{S.toast=null;render()},3200)}
function toggleTask(id){const t=TASKS.find(x=>x.id===id);t.done=!t.done;if(t.done)toast(`Completed “${t.t}”${t.p<=2?' · +40 Stardust':''}`,`TASKS.find(x=>x.id===${id}).done=false`);render()}
function tickRoutine(id){const r=ROUTINES.find(x=>x.id===id);const m=S.rt.tap;
 if(m==='cycle')r.today=r.today===null?'d':r.today==='d'?'s':null;
 else if(m==='note'){if(r.today){r.today=null}else{r.today='d';toast(`${r.n} logged. Note saved.`)}render();return}
 else r.today=r.today==='d'?null:'d';
 if(r.today==='d')toast(`${r.n} logged · ${streak(r)} day streak`,`ROUTINES.find(x=>x.id==='${id}').today=null`);else if(r.today==='s')toast(`${r.n} skipped today`);render()}
function r_dash(id){const r=ROUTINES.find(x=>x.id===id);r.dash=!r.dash;render()}
function addRoutine(f){const n=f.n.value.trim();if(!n)return;const D=S.rt.defaults;const r={id:'r'+nid++,n,ic:'circle-dashed',sched:D.sched==='Custom'?'Mon, Thu':D.sched,time:f.time.value||null,dash:D.dash,seed:nid,rate:0,hist:Array(182).fill(null),intensity:Array(182).fill(0),today:null};ROUTINES.push(r);S.rt.adding=false;S.rt.sel=r.id;toast(`Added ${n}${D.dash?' to the Dashboard':''}`);render()}
function tg(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);render()}
function togglePop(p){S.pop=S.pop===p?null:p;render()}
function clearFilters(){S.proj.f={prio:[],lb:[],due:null};S.proj.q='';render()}
function setGroupValue(t,k){const g=S.proj.group;
 if(g==='section'){if(PROJECTS[t.proj]?.sections.includes(k))t.sec=k}else if(g==='priority')t.p=+k;else if(g==='due')t.due=DUEB.find(d=>d[0]===k)[2];else if(g==='label')t.lb=k==='none'?[]:[k,...t.lb.filter(l=>l!==k)];else if(g==='status')t.done=k==='done'}
function cardDrop(e,k){e.preventDefault();const t=TASKS.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(t){setGroupValue(t,k);render()}}
function cardKey(e,id){if(!e.altKey||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const t=TASKS.find(x=>x.id===id);const proj=S.route.s==='project'?S.route.id:null;const gs=groups(filtered(TASKS.filter(x=>!proj||x.proj===proj)),proj);const i=gs.findIndex(g=>g.ts.includes(t));const j=i+(e.key==='ArrowRight'?1:-1);if(gs[j]){setGroupValue(t,String(gs[j].k));render();const el=[...document.querySelectorAll('.card')].find(c=>c.getAttribute('aria-label').startsWith(t.t));el?.focus();toast(`Moved to ${gs[j].label}`)}}
function colAdd(v,k){if(!v.trim())return;const proj=S.route.s==='project'?S.route.id:S.route.s==='inbox'?'inbox':null;const t={id:nid++,t:v.trim(),p:4,proj,sec:proj?PROJECTS[proj].sections[0]:'',due:null,lb:[],area:proj?PROJECTS[proj].area:null,done:false};setGroupValue(t,k);if(S.proj.group==='section'&&!proj){t.proj=PROJECTS[k]?k:null;t.area=PROJECTS[k]?.area||k}TASKS.push(t);S.focus='coladd';render()}
// dashboard customisation
function wMove(i,d){const ws=S.dash.widgets;const vis=ws.map((w,k)=>[w,k]).filter(([w])=>!w.hidden);const pos=vis.findIndex(([,k])=>k===i);const other=vis[pos+d];if(!other)return;[ws[i],ws[other[1]]]=[ws[other[1]],ws[i]];render()}
function wSize(id){const w=S.dash.widgets.find(x=>x.id===id);const s=[4,6,8,12];w.size=s[(s.indexOf(w.size)+1)%4];render()}
function wHide(id){S.dash.widgets.find(x=>x.id===id).hidden=true;render()}
function wShow(id){S.dash.widgets.find(x=>x.id===id).hidden=false;render()}
function wDrag(e,id){S._wd=id;e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}
function wOver(e){e.preventDefault();e.currentTarget.classList.add('dropto')}
function wDrop(e,id){e.preventDefault();const ws=S.dash.widgets;const a=ws.findIndex(w=>w.id===S._wd),b=ws.findIndex(w=>w.id===id);if(a<0||a===b)return render();const [m]=ws.splice(a,1);ws.splice(b,0,m);render()}
// roadmap
function rmSel(id){S.road.sel=id;render()}
function rmDone(id){const it=RM.items.find(i=>i.id===id);it.st=it.st==='done'?'active':'done';toast(it.st==='done'?`${it.n} done`:`${it.n} reopened`);render()}
function zoom(d){const z=Math.round(Math.min(2,Math.max(.5,S.road.zoom+d*.25))*100)/100;if(z===S.road.zoom)return;const c=document.getElementById('canvas');const mid=c?(c.scrollLeft+c.clientWidth/2)/S.road.zoom:0;S.road.zoom=z;render();const c2=document.getElementById('canvas');if(c2)c2.scrollLeft=mid*z-c2.clientWidth/2}
function scrollToday(){requestAnimationFrame(()=>{const c=document.getElementById('canvas');if(c&&S.road.mode==='canvas')c.scrollLeft=(0-RM.start)*PPD*S.road.zoom-c.clientWidth*.3})}
function panStart(e){if(e.target.closest('.node'))return;const c=e.currentTarget;const x0=e.clientX,y0=e.clientY,l=c.scrollLeft,t=c.scrollTop;c.classList.add('panning');const mv=ev=>{c.scrollLeft=l-(ev.clientX-x0);c.scrollTop=t-(ev.clientY-y0)};const up=()=>{c.classList.remove('panning');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)}
// palette
function openPal(q=''){S.pal={q,scope:'all',i:0};S.focus='palin';render()}
function palKey(e){const n=S._palFlat.length;const scopes=['all','tasks','goals','pages','places','routines','actions'];
 if(e.key==='ArrowDown'){e.preventDefault();S.pal.i=(S.pal.i+1)%Math.max(n,1);S.focus='palin';render();document.getElementById('res'+S.pal.i)?.scrollIntoView({block:'nearest'})}
 else if(e.key==='ArrowUp'){e.preventDefault();S.pal.i=(S.pal.i-1+n)%Math.max(n,1);S.focus='palin';render();document.getElementById('res'+S.pal.i)?.scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();const it=S._palFlat[S.pal.i];if(it){new Function(it.run)();render()}}
 else if(e.key==='Tab'){e.preventDefault();S.pal.scope=scopes[(scopes.indexOf(S.pal.scope)+(e.shiftKey?6:1))%7];S.pal.i=0;S.focus='palin';render()}
 else if(e.key==='Escape'){S.pal=null;render()}}
addEventListener('keydown',e=>{const typing=e.target.closest('input,textarea,select,[contenteditable]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.pal?(S.pal=null,render()):openPal()}
 else if(!typing&&e.key.toLowerCase()==='q'&&!S.qa&&!S.pal){e.preventDefault();S.qa={text:''};S.focus='qain';render()}
 else if(e.key==='Escape'&&(S.pop||S.qa||S.pal||S.drawer)){S.pop=null;S.qa=null;S.pal=null;S.drawer=false;render()}});
addEventListener('click',e=>{if(S.pop&&!e.target.closest('[data-pop]')){S.pop=null;render()}});
if(P.get('pop'))S.pop=P.get('pop');if(P.get('edit'))S.dash.edit=true;if(P.get('tab'))S.rt.tab=P.get('tab');if(P.get('drawer'))S.drawer=true;
render();
</script></body></html>
