[package]
name = "orbit-app"
version.workspace = true
edition.workspace = true

[lib]
name = "orbit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0.154"
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
orbit-client = { path = "../../crates/orbit-client" }
orbit-core = { path = "../../crates/orbit-core" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.8.1"
tokio = { version = "1.54.1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[dev-dependencies]
tempfile = "3.27.0"
