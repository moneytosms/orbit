[package]
name = "orbit-app"
version.workspace = true
edition.workspace = true

[lib]
name = "orbit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
orbit-client = { path = "../../crates/orbit-client" }
orbit-core = { path = "../../crates/orbit-core" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"

[dev-dependencies]
tempfile = "3.27.0"
