[package]
name = "orbit-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
orbit-client = { version = "0.6.1", path = "../orbit-client" }
orbit-core = { version = "0.6.1", path = "../orbit-core" }
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
terminal_size = "0.4"
unicode-width = "=0.2.2"

[dev-dependencies]
axum = "0.8.9"
orbit-server = { path = "../orbit-server" }
