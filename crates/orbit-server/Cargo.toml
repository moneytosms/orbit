[package]
name = "orbit-server"
version.workspace = true
edition.workspace = true

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
fs4 = "0.6.6"
getrandom = "0.4.3"
hex = "0.4.3"
orbit-core = { version = "0.4.0", path = "../orbit-core" }
reqwest = { version = "0.13.5", features = ["json", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite = "0.43.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
