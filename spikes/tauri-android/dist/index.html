<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width">
<title>Orbit spike</title>
<style>body{font:16px sans-serif;margin:16px}button{font-size:16px;margin:4px 0;display:block}pre{white-space:pre-wrap;font-size:12px;background:#eee;padding:8px}</style>
<h3>PROTOTYPE Orbit Android spike</h3>
<button id=r>Reminder in 60 s</button>
<button id=r3>Reminder in 3 min (for reboot test)</button>
<button id=o>Refresh outbox state</button>
<pre id=s>…</pre>
<script>
const inv = window.__TAURI__.core.invoke, s = document.getElementById('s');
const show = async () => s.textContent = JSON.stringify(await inv('state'), null, 1);
r.onclick = async () => { await inv('schedule_reminder', { secs: 60 }); show() };
r3.onclick = async () => { await inv('schedule_reminder', { secs: 180 }); show() };
o.onclick = show; show();
</script>
