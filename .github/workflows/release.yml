# Runs on the tag that scripts/release.sh --publish pushes. Builds the server image, the
# AppImage and the signed APK, then creates the GitHub Release with them.
name: release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push orbit-server (linux/amd64, linux/arm64)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack,tauri-cli
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm -C app install --frozen-lockfile
      - run: just wasm
      - name: AppImage
        run: cargo tauri build --bundles appimage
      - name: Collect AppImage
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  android:
    runs-on: ubuntu-24.04
    env:
      ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
      ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
      ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;28.2.13676358"
      - run: echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack,tauri-cli
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm -C app install --frozen-lockfile
      - run: just wasm
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          # Without a keystore Gradle would fall back to debug signing: fail instead.
          [ -n "$KEYSTORE_B64" ] || { echo "ORBIT_KEYSTORE_B64 secret is not set" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.keystore"
          echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.keystore" >> "$GITHUB_ENV"
      - name: APK
        run: cargo tauri android build --apk
      - name: Collect APK as Orbit-<version>-android.apk
        run: |
          mkdir -p dist
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          cp "$apk" "dist/Orbit-${GITHUB_REF_NAME#v}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    needs: [image, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --latest --strip header -o notes.md
          gh release create "$GITHUB_REF_NAME" --title "Orbit $GITHUB_REF_NAME" \
            --notes-file notes.md dist/*
