# Runs on the tag that scripts/release.sh --publish pushes. Builds the server image, the
# AppImage, the Windows installer (windows.yml), the signed APK and the orbit CLI (linux x86_64 and aarch64),
# then creates the GitHub Release with them.
name: release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  # One native build per architecture (no QEMU emulation), then `image` merges them into one multi-arch tag.
  image-arch:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push orbit-server (linux/${{ matrix.arch }})
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --provenance=false --platform linux/${{ matrix.arch }} \
            -t "$IMAGE:$VERSION-${{ matrix.arch }}" --push .

  image:
    needs: image-arch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tags (amd64 + arm64)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup show
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just,wasm-pack,tauri-cli
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm -C app install --frozen-lockfile
      - run: just wasm
      - name: AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles appimage
      - name: Collect AppImage, signature and latest.json
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig dist/
          image=$(basename dist/*.AppImage)
          VERSION="${GITHUB_REF_NAME#v}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Orbit $GITHUB_REF_NAME" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "dist/$image.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$image" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"linux-x86_64": {signature: $sig, url: $url}}}' \
            > dist/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*

  android:
    runs-on: ubuntu-24.04
    env:
      ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
      ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
      ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools # v3's old default also asks for the removed `tools` package
      - run: sdkmanager --install "ndk;28.2.13676358"
      - run: echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just,wasm-pack,tauri-cli
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm -C app install --frozen-lockfile
      - run: just wasm
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          # Without a keystore Gradle would fall back to debug signing: fail instead.
          [ -n "$KEYSTORE_B64" ] || { echo "ORBIT_KEYSTORE_B64 secret is not set" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.keystore"
          echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.keystore" >> "$GITHUB_ENV"
      - name: APK
        run: cargo tauri android build --apk
      - name: Collect APK as Orbit-<version>-android.apk
        run: |
          mkdir -p dist
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          cp "$apk" "dist/Orbit-${GITHUB_REF_NAME#v}-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*

  cli:
    # Oldest runner images on purpose: the binary links glibc, so a lower build glibc runs on more distros.
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: cargo build --release --locked -p orbit-cli
      - name: Package orbit-<version>-linux-<arch>.tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="orbit-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "dist" "$NAME/man"
          cp target/release/orbit LICENSE "$NAME/"
          cp docs/man/*.1 "$NAME/man/"
          tar -czf "dist/$NAME.tar.gz" "$NAME"
          "$NAME/orbit" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.arch }}
          path: dist/*

  windows:
    # windows.yml's job needs contents: write for its manual attach-to-release path.
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  publish:
    needs: [image, linux, windows, android, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist
      - name: Merge the Windows updater entry into latest.json
        run: |
          jq -s '.[0] * .[1]' dist/latest.json dist/latest-windows.json > dist/merged.json
          mv dist/merged.json dist/latest.json
          rm dist/latest-windows.json
      - name: Generate release checksums
        run: scripts/write-release-checksums.sh dist
      - name: Verify GHCR image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker manifest inspect "$IMAGE:$VERSION"
          docker manifest inspect "$IMAGE:latest"
      - name: Verify staged release assets and checksums
        run: scripts/check-release-assets.sh "${GITHUB_REF_NAME#v}" dist
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: git-cliff
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --latest --strip header -o notes.md
          gh release create "$GITHUB_REF_NAME" --title "Orbit $GITHUB_REF_NAME" \
            --notes-file notes.md dist/*
