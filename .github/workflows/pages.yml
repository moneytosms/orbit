name: Site

# Builds site/ (landing page + guide rendered from the repo's own docs) and
# publishes it to GitHub Pages. Docs changes redeploy because the guide
# renders them directly.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "app/**", "crates/**", "*.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "app/**", "crates/**", "*.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: rustup show
        working-directory: .
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just,wasm-pack
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      # The web app with an in-browser fake server, served at /demo/ (no backend needed).
      - name: Build the web demo
        working-directory: .
        run: |
          just wasm
          pnpm -C app install --frozen-lockfile
          just demo
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Exercise the built site
        run: |
          npm run preview -- --background --host 127.0.0.1 --port 4321
          node --input-type=module -e 'import c from "./site.config.mjs";for(let i=0;i<30;i++){try{if((await fetch("http://127.0.0.1:4321"+c.base+"/")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)'
          npm test
      - name: Stop the preview
        if: always()
        run: npx astro preview stop
      - name: No placeholder screenshots ship
        run: "! grep -rl 'Screenshot pending' dist"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
